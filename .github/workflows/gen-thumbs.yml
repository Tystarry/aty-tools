name: gen-thumbs

on:
  push:
    paths:
      - 'assets/**'
  workflow_dispatch:

jobs:
  gen:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install oiiotool
        run: |
          sudo apt-get update
          sudo apt-get install -y openimageio-tools
      - name: Generate thumbnails
        run: python3 .github/gen_thumbs.py
      - name: Commit & push
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
          else
            git config user.name "thumb-bot"
            git config user.email "thumb-bot@users.noreply.github.com"
            git add -A
            git commit -m "[skip ci] Auto thumbnails"
            git push
          fi
