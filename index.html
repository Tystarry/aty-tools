<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI_TY 插件面板</title>
<style>
:root{--bg:#1a1d23;--card:#21252b;--card-hover:#282c34;--border:#333842;--text:#c8ccd4;--dim:#7f848e;--accent:#61afef;--ok:#98c379;--warn:#e5c07b;--code-bg:#1a1d23;--inp:#282c34;--r:10px;--m-card:#252830}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:600;white-space:nowrap}
.search-wrap{flex:1;min-width:180px;max-width:380px;position:relative}
.search-wrap input{width:100%;padding:7px 10px 7px 32px;background:var(--inp);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px}
.fbtn{padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:transparent;color:var(--dim);cursor:pointer;font-size:12px;transition:all .2s}
.fbtn:hover{border-color:var(--accent);color:var(--text)}
.fbtn.on{background:var(--accent);color:#1a1d23;border-color:var(--accent)}
.main{display:flex}
.side{width:190px;border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.side .sec{padding:6px 16px;font-size:11px;color:var(--dim);letter-spacing:1px}
.side a{display:block;padding:6px 16px;color:var(--dim);text-decoration:none;font-size:12px;border-left:2px solid transparent;cursor:pointer}
.side a:hover{color:var(--text);background:var(--card)}
.side a.on{color:var(--accent);border-left-color:var(--accent);background:var(--card)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}
.dot.ok{background:var(--ok)}.dot.wip{background:var(--warn)}
.content{flex:1;padding:20px;min-width:0}
.bar{margin-bottom:16px}.bar h2{font-size:18px;margin-bottom:2px}.bar .sub{color:var(--dim);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .15s;position:relative}
.card:hover{border-color:var(--accent);background:var(--card-hover)}
.card .tag{position:absolute;top:10px;right:10px;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600}
.tag-ok{color:var(--ok);background:#98c37918;border:1px solid #98c37933}
.tag-wip{color:var(--warn);background:#e5c07b18;border:1px solid #e5c07b33}
.card .sw{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--border);color:var(--dim)}
.card h3{font-size:17px;margin:5px 0;color:var(--accent);font-weight:600;letter-spacing:.3px}
.card .desc{color:var(--dim);font-size:12px;line-height:1.4;margin-bottom:6px}
.card .foot{display:flex;gap:10px;font-size:11px;color:var(--dim);align-items:center}
.card .detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.card.open .detail{display:block}
.pkg-l{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--accent);color:#1a1d23;border-radius:6px;text-decoration:none;font-size:11px;font-weight:600;margin-left:auto;transition:opacity .2s;white-space:nowrap}
.pkg-l:hover{opacity:.8}

/* 方法模块 */
.methods-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.method-item{background:var(--m-card);border-radius:6px;overflow:hidden;cursor:pointer;transition:all .15s;border:1.5px solid #b8a99a;border-top-width:4px}
.method-item:hover{filter:brightness(1.08)}
.method-item .m-head{display:flex;align-items:flex-start;justify-content:space-between;padding:9px 11px}
.method-item .m-info{flex:1;min-width:0}
.method-item .m-name{font-size:12px;font-weight:500;margin-bottom:4px;line-height:1.35;letter-spacing:.2px}
.method-item .m-tags{display:flex;flex-wrap:wrap;gap:4px}
.method-item .m-tag{padding:1px 7px;border-radius:9px;font-size:10px;white-space:nowrap}
.m-tag.pro{background:#98c37914;color:#8ab87a;border:1px solid #98c37928}
.m-tag.con{background:#e5c07b14;color:#c8a860;border:1px solid #e5c07b28}
.method-item .m-dl{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;background:var(--card);color:var(--dim);border:1px solid var(--border);border-radius:4px;text-decoration:none;font-size:10px;white-space:nowrap;flex-shrink:0;margin-left:6px;transition:all .15s;cursor:pointer}
.method-item .m-dl:hover{background:var(--accent);color:#1a1d23;border-color:var(--accent)}
.method-item .m-body{display:none;padding:0 10px 10px;border-top:1px solid rgba(255,255,255,.04)}
.method-item.open{grid-column:1 / -1}
.method-item.open .m-body{display:block}
.m-arrow{display:inline-block;transition:transform .2s;font-size:10px;margin-left:4px}
.method-item.open .m-arrow{transform:rotate(90deg)}

/* 代码 */
.code-box{background:var(--code-bg);border:1px solid var(--border);border-radius:6px;margin:8px 0;position:relative}
.code-box pre{padding:10px 50px 10px 10px;margin:0;font-family:"Cascadia Code","Fira Code",Consolas,monospace;font-size:12px;line-height:1.4;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto}
.cbtn{position:absolute;top:4px;right:4px;background:var(--border);border:none;color:var(--dim);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px;transition:all .15s}
.cbtn:hover{background:var(--accent);color:#1a1d23}
.cbtn.done{background:var(--ok);color:#1a1d23}

/* 卡片内按钮 */
.card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--border);color:var(--text);border:none;border-radius:6px;cursor:pointer;font-size:11px;transition:all .15s}
.card-btn:hover{background:var(--accent);color:#1a1d23}
.diag-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#61afef18;color:var(--accent);border:1px solid #61afef33;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;transition:all .2s}
.diag-btn:hover{background:#61afef28;border-color:var(--accent)}
.diag-btn:active{transform:scale(.98)}

/* 弹窗 */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:900px;width:95%;max-height:85vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
.modal-close:hover{color:var(--text)}
.modal-box h2{font-size:18px;margin-bottom:16px}
.modal-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.modal-cols{grid-template-columns:1fr}}
.modal-col h3{font-size:13px;margin-bottom:8px;color:var(--dim)}
.modal-col textarea{width:100%;height:300px;background:var(--code-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-family:monospace;padding:10px;resize:vertical}
.modal-col .hint{font-size:11px;color:var(--dim);margin:4px 0 8px}
.modal-col button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--border);color:var(--text);cursor:pointer;font-size:12px;margin-top:6px;transition:all .15s}
.modal-col button.gen{background:var(--accent);color:#1a1d23;border-color:var(--accent)}
.modal-col button:hover{opacity:.85}

/* 脚本区 */
.script-section{border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:8px}
.script-section .s-name{font-size:12px;font-weight:600;margin-bottom:4px}
.script-section .s-hint{font-size:10px;color:var(--dim);margin-bottom:6px}
.script-section .s-actions{display:flex;gap:6px}

/* 结果表 */
.diag-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.diag-table th{background:var(--border);padding:6px 10px;text-align:left;font-weight:600}
.diag-table td{padding:5px 10px;border-bottom:1px solid var(--border)}
.diag-table .ok{color:var(--ok)}.diag-table .bad{color:#e05555}.diag-table .warn{color:var(--warn)}

.flist{list-style:none}.flist li{padding:2px 0;font-size:12px;color:var(--dim)}
.track{margin-top:10px;font-size:12px;color:var(--dim)}.track p{margin:2px 0}

.empty{text-align:center;padding:60px 20px;color:var(--dim)}.empty .big{font-size:40px;margin-bottom:12px}
.msg-item{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.msg-item .who{font-weight:600;color:var(--accent);margin-right:8px}
.msg-item .when{font-size:10px;color:var(--dim);margin-left:8px}
.msg-item .what{color:var(--text);margin-top:2px}
@media(max-width:768px){.side{display:none}.grid{grid-template-columns:1fr}.methods-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
<h1>🧩 插件面板 v3</h1>
<div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="search" placeholder="搜索插件、功能、报错信息..." oninput="render()"></div>
<button class="fbtn on" data-sw="all" onclick="setFilt('all',this)">全部</button>
<button class="fbtn" data-sw="Maya" onclick="setFilt('Maya',this)">Maya</button>
<button class="fbtn" data-sw="Nuke" onclick="setFilt('Nuke',this)">Nuke</button>
<button class="fbtn" data-sw="UE" onclick="setFilt('UE',this)">UE</button>
</div>
<div class="main">
<nav class="side" id="side"></nav>
<main class="content" id="main"></main>

</div>

<!-- 开发日志底部栏 -->
<div id="log-bar" style="position:fixed;bottom:0;left:0;right:0;z-index:140;background:var(--card);border-top:1px solid var(--border);padding:5px 16px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--dim)">
  <span>📝 <span id="log-latest">加载中...</span></span>
  <span style="display:flex;gap:8px;align-items:center">
    <span id="log-admin-actions" style="display:none">
      <button onclick="toggleLog()" style="background:var(--border);border:none;color:var(--dim);cursor:pointer;font-size:10px;padding:2px 6px;border-radius:3px">📋 完整日志</button>
      <button onclick="copyFullLog()" style="background:var(--border);border:none;color:var(--dim);cursor:pointer;font-size:10px;padding:2px 6px;border-radius:3px">📤 复制全部</button>
    </span>
  </span>
</div>
<!-- 完整日志弹窗 -->
<div id="log-full" style="display:none;position:fixed;bottom:28px;left:0;right:0;z-index:139;background:var(--card);border-top:1px solid var(--border);max-height:50vh;overflow-y:auto;padding:16px 24px">
  <div id="log-full-list"></div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-box">
<button class="modal-close" onclick="closeModal()">✕</button>
<div id="modal-content"></div>
</div>
</div>

<script type="application/json" id="data-store">
[{"software": "Maya", "subtag": "arnold", "category": "成功", "name": "aov-duplicate-alias-fix", "description": "Maya Arnold AOV 重复别名修复 — 解决 \\\"ai_aov_xxx is not a unique name\\\" 报错", "usage": ["# 方式一：一键修复\nexec(open(r'D:\\zcy\\ai_ty\\fix_maya_aov_duplicate_alias.py', encoding='utf-8').read())\n\n# 方式二：命令行（无需打开 Maya UI）\nmayapy.exe fix_maya_aov_duplicate_alias.py scene.ma\n\n# 方式三：永久生效（userSetup.py）\nimport fix_maya_aov_duplicate_alias\nfix_maya_aov_duplicate_alias.patch_mtoa()\n\n# crypto_asset 专项：\nexec(open(r'D:\\zcy\\ai_ty\\fix_aov_crypto_asset.py', encoding='utf-8').read())"], "files": [{"name": "fix_duplicate_aov_alias.py", "path": "d:/zcy/ai_ty/fix_duplicate_aov_alias.py"}, {"name": "fix_maya_aov_duplicate_alias.py", "path": "d:/zcy/ai_ty/fix_maya_aov_duplicate_alias.py"}, {"name": "fix_aov_crypto_asset.py", "path": "d:/zcy/ai_ty/fix_aov_crypto_asset.py"}], "package": "maya_aov_fix.zip", "is_tracking": false, "errorPatterns": ["- AOV Editor 无法打开或闪退\n- 添加 crypto_asset 等 AOV 时报错\n\n## 文件清单\n\n| 文件 | 功能 |\n|------|------|\n| [fix_duplicate_aov_alias.py](d:/zcy/ai_ty/fix_duplicate_aov_alias.py) | 简易版 — 针对单个别名快速修复 |\n| [fix_maya_aov_duplicate_alias.py](d:/zcy/ai_ty/fix_maya_aov_duplicate_alias.py) | 完整版 — 全场景扫描 + MtoA 热修补 |\n| [fix_aov_crypto_asset.py](d:/zcy/ai_ty/fix_aov_crypto_asset.py) | crypto_asset 专项 — 修复添加 crypto_asset AOV 报错 |\n\n## 用法", "ai_aov_xxx is not a unique name. Cannot remove alias."], "embeddedScripts": [{"name": "fix_duplicate_aov_alias.py", "content": "\"\"\"\nMaya Python Script - Clean up duplicate AOV alias on initialParticleSE\n\nUsage: paste into Maya Script Editor and run, or:\n         exec(open(r'd:\\\\zcy\\\\ai_ty\\\\fix_duplicate_aov_alias.py', encoding='utf-8').read())\n\"\"\"\n\nimport maya.cmds as cmds\n\n\ndef fix_duplicate_alias(sg, alias_name):\n    \"\"\"Remove duplicate alias using removeMultiInstance (same approach as MtoA removeAliases)\"\"\"\n    all_aliases = cmds.aliasAttr(sg, query=True) or []\n    print(\"Node {} has {} aliases\".format(sg, len(all_aliases)))\n\n    if alias_name not in all_aliases:\n        print(\"Alias '{}' not found on {}. Nothing to fix.\".format(alias_name, sg))\n        return\n\n    try:\n        cmds.removeMultiInstance(sg + '.' + alias_name)\n        print(\"Removed alias '{}' via removeMultiInstance.\".format(alias_name))\n    except Exception as e:\n        print(\"removeMultiInstance failed: {}\".format(e))\n        try:\n            cmds.aliasAttr(sg + '.' + alias_name, remove=True)\n            print(\"Removed alias via aliasAttr remove.\")\n        except Exception as e2:\n            print(\"aliasAttr remove also failed: {}\".format(e2))\n            return\n\n    remaining = cmds.aliasAttr(sg, query=True) or []\n    if alias_name in remaining:\n        print(\"WARNING: alias '{}' still exists on {}!\".format(alias_name, sg))\n    else:\n        print(\"Cleanup done. You can now re-add the AOV via AOV Editor.\")\n\n\nif __name__ == \"__main__\" or True:\n    fix_duplicate_alias(\"initialParticleSE\", \"ai_aov_crypto_asset\")\n"}, {"name": "fix_maya_aov_duplicate_alias.py", "content": "\"\"\"\nMaya 脚本 — 修复 \"ai_aov_xxx is not a unique name. Cannot remove alias.\" 错误。\n\n问题原因：着色引擎 (shading engine, 如 initialParticleSE) 上某个 AOV 别名被重复创建，\n         MtoA 自带的 removeAliases 无法处理重复别名，导致崩溃。\n\n解决方式：\n  1. fix_duplicate_aliases() — 扫描所有着色引擎，用 removeMultiInstance 清理重复别名\n  2. patch_mtoa()           — 热修补 MtoA 的 removeAliases，防止日后再次出现同样错误\n  3. run()                  — 一键修复 + 打补丁\n\n使用方法（在出问题的 Maya 电脑上操作）：\n  方法A — 复制下方一行到 Maya Script Editor (Python 标签页)，回车运行：\n    exec(open(r'D:\\\\zcy\\\\ai_ty\\\\fix_maya_aov_duplicate_alias.py', encoding='utf-8').read())\n\n  方法B — 把本文件拷贝到 U 盘，在 Maya Script Editor 中执行：\n    exec(open(r'E:\\\\fix_maya_aov_duplicate_alias.py', encoding='utf-8').read())\n    （路径改成 U 盘实际路径）\n\n  方法C — Maya 菜单：File > Script Editor > File > Load Script，加载后 Ctrl+Enter 运行。\n\n  方法D — 命令行启动 Maya 时直接执行（无需打开 UI）：\n    mayapy.exe fix_maya_aov_duplicate_alias.py scene.ma\n\n如果需要每次打开 Maya 自动生效，把以下两行加到 userSetup.py：\n    import sys; sys.path.append(r'D:\\zcy\\ai_ty')\n    import fix_maya_aov_duplicate_alias; fix_maya_aov_duplicate_alias.patch_mtoa()\n\"\"\"\n\nimport maya.cmds as cmds\n\n\n# ============================================================================\n# 核心修复：清理所有着色引擎上的重复 AOV 别名\n# ============================================================================\n\ndef fix_duplicate_aliases(target_sg=None):\n    \"\"\"\n    扫描着色引擎，移除重复的 AOV 别名。\n\n    参数:\n        target_sg: 指定着色引擎名称，如 \"initialParticleSE\"。\n                   为 None 则扫描全部着色引擎。\n    返回:\n        修复成功的着色引擎数量。\n    \"\"\"\n    shading_engines = cmds.ls(type='shadingEngine')\n    if not shading_engines:\n        print(\"[fix_aov] 场景中没有着色引擎。\")\n        return 0\n\n    fixed_count = 0\n\n    for sg in shading_engines:\n        # 如果指定了目标着色引擎，只处理它\n        if target_sg and sg != target_sg:\n            continue\n\n        # 跳过参考节点（referenced nodes）\n        if cmds.referenceQuery(sg, isNodeReferenced=True):\n            continue\n\n        # 检查该节点上是否有 attributeAliasList\n        if not cmds.attributeQuery('attributeAliasList', node=sg, exists=True):\n            continue\n\n        all_aliases = cmds.aliasAttr(sg, query=True) or []\n        if not all_aliases:\n            continue\n\n        # 找出重复的别名（all_aliases 是 [aliasName1, plugName1, aliasName2, plugName2, ...]）\n        # 只检查 ai_aov_ 开头的别名\n        alias_names = all_aliases[0::2]  # 偶数下标是别名，奇数是插件名\n        aov_aliases = [a for a in alias_names if a.startswith('ai_aov_')]\n\n        # 统计各别名出现次数，找出重复项\n        from collections import Counter\n        dup_aliases = [a for a, cnt in Counter(aov_aliases).items() if cnt > 1]\n\n        if not dup_aliases:\n            continue\n\n        print(\"[fix_aov] {} 发现 {} 个重复 AOV 别名: {}\".format(\n            sg, len(dup_aliases), \", \".join(dup_aliases)))\n\n        for alias_name in dup_aliases:\n            # MtoA 使用 aliasAttr(remove=True) 删除重复别名会报：\n            #   \"xxx is not a unique name. Cannot remove alias.\"\n            # 解决方法：使用 removeMultiInstance，它能处理重复实例\n            attr_full = sg + '.' + alias_name\n\n            try:\n                cmds.removeMultiInstance(attr_full, b=True)\n                print(\"[fix_aov]   -> removeMultiInstance 移除 '{}' 成功\".format(alias_name))\n            except Exception as e1:\n                print(\"[fix_aov]   -> removeMultiInstance 失败: {}\".format(e1))\n                # 最后的兜底手段：删除并重建 attributeAliasList\n                try:\n                    alias_list_attr = sg + '.attributeAliasList'\n                    cmds.deleteAttr(alias_list_attr)\n                    print(\"[fix_aov]   -> 已删除 {} 整个 attributeAliasList 作为兜底\".format(alias_list_attr))\n                except Exception as e2:\n                    print(\"[fix_aov]   -> 兜底方案也失败: {}\".format(e2))\n\n        # 验证修复结果\n        remaining = cmds.aliasAttr(sg, query=True) or []\n        remaining_names = remaining[0::2]\n        still_dup = [a for a, cnt in Counter(remaining_names).items()\n                     if cnt > 1 and a.startswith('ai_aov_')]\n        if not still_dup:\n            fixed_count += 1\n            print(\"[fix_aov] {} 修复完成，所有重复别名已清理。\".format(sg))\n        else:\n            print(\"[fix_aov] {} WARNING: 仍有重复别名: {}\".format(sg, still_dup))\n\n    print(\"[fix_aov] 一共修复了 {} 个着色引擎。\".format(fixed_count))\n    return fixed_count\n\n\n# ============================================================================\n# 热修补：拦截 MtoA 的 removeAliases 函数，让它在内存里就被修正\n# ============================================================================\n\n_patched = False\n\n\ndef patch_mtoa():\n    \"\"\"\n    热修补 mtoa.aovs.removeAliases 函数。\n\n    把 MtoA 原版的 aliasAttr(remove=True) 替换为：\n      1. 先尝试 aliasAttr(remove=True)\n      2. 失败则用 removeMultiInstance\n      3. 再失败则跳过，不崩溃\n\n    这个补丁只在内存中生效，不需要管理员权限，重启 Maya 后失效。\n    如果需要永久生效，请加到 userSetup.py。\n\n    可以安全地多次调用（只生效一次）。\n    \"\"\"\n    global _patched\n    if _patched:\n        print(\"[fix_aov] MtoA 已经打过补丁，跳过。\")\n        return\n\n    try:\n        import mtoa.aovs as aovs\n\n        original_remove = aovs.removeAliases\n\n        def safe_removeAliases(sg):\n            \"\"\"包裹后的 removeAliases：用 removeMultiInstance 兜底\"\"\"\n            sg = str(sg)\n            if not sg or not cmds.objExists(sg):\n                return\n\n            if not cmds.attributeQuery('attributeAliasList', node=sg, exists=True):\n                return\n\n            all_aliases = cmds.aliasAttr(sg, query=True) or []\n            if not all_aliases:\n                return\n\n            for alias in all_aliases:\n                if not alias.startswith('ai_aov_'):\n                    continue\n\n                full_attr = sg + '.' + alias\n                try:\n                    cmds.aliasAttr(full_attr, remove=True)\n                except RuntimeError as e:\n                    # \"not a unique name\" 错误在这里被拦截\n                    print(\"[fix_aov] aliasAttr remove 失败({}), 改用 removeMultiInstance...\".format(alias))\n                    try:\n                        cmds.removeMultiInstance(full_attr, b=True)\n                        print(\"[fix_aov] removeMultiInstance 成功: {}\".format(full_attr))\n                    except Exception as e2:\n                        print(\"[fix_aov] removeMultiInstance 也失败({}), 跳过. 错误: {}\".format(alias, e2))\n\n        aovs.removeAliases = safe_removeAliases\n        _patched = True\n        print(\"[fix_aov] MtoA removeAliases 补丁已生效。\")\n\n    except ImportError:\n        print(\"[fix_aov] 无法 import mtoa.aovs，Arnold 插件是否已加载？\")\n    except Exception as e:\n        print(\"[fix_aov] 打补丁失败: {}\".format(e))\n\n\n# ============================================================================\n# 处理特定场景文件（命令行模式）\n# ============================================================================\n\ndef fix_scene_file(filepath, dry_run=False):\n    \"\"\"\n    直接修复 .ma/.mb 文件中的重复别名（文本替换方式）。\n\n    不通过 Maya，直接解析并修改 .ma 文本文件。\n    适用于场景打不开、Maya 闪退等无法进入 Maya 的情况。\n\n    参数:\n        filepath: .ma 文件的完整路径\n        dry_run:  True 则只检查不修改\n    \"\"\"\n    import re\n\n    if not filepath.lower().endswith('.ma'):\n        print(\"[fix_aov] 此模式仅支持 .ma (Maya ASCII) 文件。\")\n        print(\"[fix_aov] 请将场景另存为 .ma 格式后再试。\")\n        return\n\n    with open(filepath, 'r', encoding='utf-8', errors='replace') as f:\n        content = f.read()\n\n    # 匹配模式：initialParticleSE 节点中的重复 ai_aov_* 别名\n    # .ma 文件中别名以 \"attrAliasList\" 形式存储在一行或多行\n    # 具体格式类似：\n    #   setAttr \".attributeAliasList\" -type \"attributeAlias\" ...\n    # 或者\n    #   addAttr -ci true -sn \"ai_aov_xxx\" ...\n\n    # 统计匹配到的别名\n    alias_pattern = re.compile(r'ai_aov_\\w+')\n    matches = alias_pattern.findall(content)\n    from collections import Counter\n    dup_found = {a: c for a, c in Counter(matches).items() if c > 1}\n\n    if not dup_found:\n        print(\"[fix_aov] 场景文件中未发现重复的 AOV 别名。\")\n        return\n\n    print(\"[fix_aov] 场景文件中发现以下重复 AOV 别名:\")\n    for alias, count in dup_found.items():\n        print(\"  {} (出现 {} 次)\".format(alias, count))\n\n    if dry_run:\n        print(\"[fix_aov] dry-run 模式，未修改文件。\")\n        return\n\n    # 修复：对于 .ma 文件，重复别名通常出现在多个 createNode / addAttr 块中\n    # 由于 .ma 格式复杂，建议通过 Maya 打开后再用 fix_duplicate_aliases() 修复\n    print(\"[fix_aov] 文件级修复较复杂，建议在 Maya 中打开场景后运行 fix_duplicate_aliases()。\")\n    print(\"[fix_aov] 也可以尝试：打开场景 -> 忽略错误 -> Script Editor 中运行 exec(open(...)).\")\n\n\n# ============================================================================\n# 一键运行\n# ============================================================================\n\ndef run(target_sg=None):\n    \"\"\"\n    一键修复：先打补丁防止未来出错，再清理当前场景的重复别名。\n\n    参数:\n        target_sg: 指定着色引擎名称（如 \"initialParticleSE\"），None = 全部扫描\n    \"\"\"\n    print(\"=\" * 60)\n    print(\"Maya AOV 重复别名修复工具\")\n    print(\"=\" * 60)\n\n    # 第1步：先打补丁，防止 Mtoa 的 removeAliases 再次崩溃\n    patch_mtoa()\n\n    # 第2步：清理当前场景的重复别名\n    print(\"\")\n    fix_duplicate_aliases(target_sg=target_sg)\n\n    # 第3步：清理后重建 AOV 别名（Mtoa 在下次打开 AOV Editor 时会自动重建）\n    print(\"\")\n    print(\"[fix_aov] 完成。现在可以打开 AOV Editor 正常操作了。\")\n\n\n# ============================================================================\n# 入口：按 import / 直接 exec() / mayapy 三种方式自动适配\n# ============================================================================\n\nif __name__ == \"__main__\" or __name__ == \"__builtin__\":\n    # 直接运行 / exec() 方式：按需额外指定\n    run()\n"}, {"name": "fix_aov_crypto_asset.py", "content": "\"\"\"\nMaya standalone script — fix \"Cannot add crypto_asset AOV\" error.\n\nWhat this does:\n  1. fix()     — cleans up duplicate AOV aliases in the current scene\n  2. patch()   — monkey-patches MtoA's addAliases/createAliases in memory so the\n                 same error won't happen again (no admin rights needed)\n\nUsage (in Maya Script Editor, Python tab):\n  =========================================\n\n  # One-liner (run this, then open AOV Editor):\n  exec(open(r'd:\\zcy\\ai_ty\\fix_aov_crypto_asset.py', encoding='utf-8').read())\n\n  # Or step-by-step:\n  import fix_aov_crypto_asset\n  fix_aov_crypto_asset.patch()            # prevent future crashes\n  fix_aov_crypto_asset.fix(\"crypto_asset\")  # clean up current scene\n  =========================================\n\nTo make it permanent (auto-run on Maya startup), add these lines to your\nMaya userSetup.py or a shelf button.\n\"\"\"\n\nimport maya.cmds as cmds\n\n\n# ---------------------------------------------------------------------------\n# Part 1: Scene cleanup — fix duplicate aliases on shading engines\n# ---------------------------------------------------------------------------\n\ndef fix(aov_name=\"crypto_asset\"):\n    \"\"\"\n    Remove duplicate 'ai_aov_<aov_name>' aliases from all local shading engines.\n\n    Call this BEFORE trying to add the AOV in the AOV Editor.\n    \"\"\"\n    alias_name = \"ai_aov_\" + aov_name\n    fixed_count = 0\n\n    shading_engines = cmds.ls(type='shadingEngine')\n    if not shading_engines:\n        print(\"[fix_aov] No shading engines found in scene.\")\n        return\n\n    print(\"[fix_aov] Scanning {} shading engines for alias '{}'...\".format(\n        len(shading_engines), alias_name))\n\n    for sg in shading_engines:\n        if cmds.referenceQuery(sg, isNodeReferenced=True):\n            continue\n\n        existing = cmds.aliasAttr(sg, query=True) or []\n        if alias_name not in existing:\n            continue\n\n        count = existing.count(alias_name)\n        print(\"[fix_aov]   {}: found '{}' x{} — cleaning...\".format(\n            sg, alias_name, count))\n\n        try:\n            cmds.removeMultiInstance(sg + '.' + alias_name)\n        except Exception:\n            try:\n                cmds.aliasAttr(sg + '.' + alias_name, remove=True)\n            except Exception:\n                pass\n\n        remaining = cmds.aliasAttr(sg, query=True) or []\n        if alias_name not in remaining:\n            fixed_count += 1\n            print(\"[fix_aov]     -> cleaned.\")\n        else:\n            print(\"[fix_aov]     -> WARNING: still present. Try restarting Maya.\")\n\n    if fixed_count:\n        print(\"[fix_aov] Done. Fixed {} shading engine(s).\".format(fixed_count))\n    else:\n        print(\"[fix_aov] No dirty aliases found. You should be able to add \"\n              \"'{}' now.\".format(aov_name))\n\n\n# ---------------------------------------------------------------------------\n# Part 2: MtoA runtime patch — prevent the error from happening again\n# ---------------------------------------------------------------------------\n\n_patched = False\n\n\ndef _build_safe_add_aliases(original_addAliases):\n    \"\"\"Wrap addAliases so aliasAttr(remove=True) failures fall back to\n       removeMultiInstance instead of crashing.\"\"\"\n    def safe_addAliases(aovs):\n        for sg in cmds.ls(type='shadingEngine'):\n            sgAttr = '{}.aiCustomAOVs'.format(sg)\n            # call the original getShadingGroupAOVMap from mtoa.aovs\n            from mtoa.aovs import getShadingGroupAOVMap\n            nameMapping, nextIndex = getShadingGroupAOVMap(sgAttr)\n            for aov in aovs:\n                try:\n                    plug = nameMapping[aov.name]\n                except KeyError:\n                    plug = '{}[{}].aovName'.format(sgAttr, nextIndex)\n                    cmds.setAttr(plug, aov.name, type=\"string\")\n                    nextIndex += 1\n\n                if cmds.referenceQuery(sg, isNodeReferenced=True):\n                    continue\n\n                aliasName = 'ai_aov_' + aov.name\n                try:\n                    cmds.aliasAttr(aliasName, plug)\n                except Exception:\n                    try:\n                        cmds.aliasAttr(sg + '.' + aliasName, remove=True)\n                    except Exception:\n                        try:\n                            cmds.removeMultiInstance(sg + '.' + aliasName)\n                        except Exception:\n                            pass\n                    try:\n                        cmds.aliasAttr(aliasName, plug)\n                    except Exception:\n                        pass\n    return safe_addAliases\n\n\ndef _build_safe_create_aliases(original_createAliases):\n    \"\"\"Wrap createAliases with the same removeMultiInstance fallback.\"\"\"\n    def safe_createAliases(sg):\n        sg = str(sg)\n        if sg == '' or not cmds.objExists(sg):\n            return\n        if sg == \"swatchShadingGroup\":\n            return\n\n        if cmds.attributeQuery('attributeAliasList', node=sg, exists=True):\n            alias_list = '{}.attributeAliasList'.format(sg)\n            if cmds.objExists(alias_list) and not cmds.aliasAttr(sg, q=True):\n                print(\"Shading Group %s with bad Attribute Alias list detected. Fixing!\" % sg)\n                cmds.deleteAttr(alias_list)\n\n        from mtoa.aovs import getAOVNodes, listAvailableIndices\n        aovList = getAOVNodes(True)\n        sgPlug = \"{}.aiCustomAOVs\".format(sg)\n\n        sgLogIdx = cmds.getAttr(sgPlug, mi=True) or []\n        s = set([cmds.getAttr(\"{}[{}].aovName\".format(sgPlug, i)) for i in sgLogIdx])\n        free = listAvailableIndices(sgLogIdx, len(aovList))\n        n = 0\n        for aov in aovList:\n            if aov[0] not in s:\n                cmds.setAttr(\"{}[{}].aovName\".format(sgPlug, free[n]), aov[0], typ=\"string\")\n                n += 1\n\n        if cmds.referenceQuery(sg, isNodeReferenced=True):\n            return\n\n        sgAttr = '{}.aiCustomAOVs'.format(sg)\n        attrValues = cmds.getAttr(sgAttr, mi=True) or []\n        for i in attrValues:\n            at = '{}[{}]'.format(sgAttr, i)\n            name = cmds.getAttr('{}.aovName'.format(at))\n            aliasName = 'ai_aov_' + name\n            try:\n                cmds.aliasAttr(aliasName, at)\n            except Exception:\n                try:\n                    cmds.aliasAttr(sg + '.' + aliasName, remove=True)\n                except Exception:\n                    try:\n                        cmds.removeMultiInstance(sg + '.' + aliasName)\n                    except Exception:\n                        pass\n                try:\n                    cmds.aliasAttr(aliasName, at)\n                except Exception:\n                    pass\n    return safe_createAliases\n\n\ndef patch():\n    \"\"\"\n    Monkey-patch mtoa.aovs.addAliases and mtoa.aovs.createAliases in memory.\n\n    This prevents the \"not a unique name\" crash when adding AOVs, without\n    needing to modify files in Program Files (no admin rights required).\n\n    Call once per Maya session, before opening the AOV Editor.\n    Safe to call multiple times.\n    \"\"\"\n    global _patched\n    if _patched:\n        print(\"[fix_aov] MtoA already patched in this session.\")\n        return\n\n    try:\n        import mtoa.aovs as rrorPatterns": [], "embeddedScripts": [{"name": "abc_blendshape_diagnostic.py", "content": "\"\"\"\nMaya 脚本 — ABC 流程 blendShape 诊断工具\n\n场景：mod 模型需要接收 ABC 动画缓存的 blendShape，\n      当 BS 做不上时，用此脚本诊断对照问题。\n\n用法：\n  1. Maya Script Editor (Python) 中运行\n  2. 输入 mod 组名（如 Ahri_mod3）和 ABC 组名（如 CHR_Ahri）\n  3. 自动扫描比对，输出 JSON → 复制到仪表盘生成清单\n\n输出格式：\n  {\n    \"mod_group\": \"Ahri_mod3\",\n    \"abc_group\": \"CHR_Ahri\",\n    \"time\": \"2026-07-20 15:30:00\",\n    \"summary\": {\"total\":94, \"ok\":72, \"mismatch\":5, \"mod_only\":8, \"abc_only\":2},\n    \"pairs\": [\n      {\"name\":\"mesh_01_Geo\", \"mod_vtx\":1234, \"abc_vtx\":1234, \"status\":\"ok\"},\n      {\"name\":\"mesh_02_Geo\", \"mod_vtx\":1000, \"abc_vtx\":1200, \"status\":\"mismatch\"},\n      ...\n    ],\n    \"mod_only\": [\"xgen_hair_Geo\", ...],\n    \"abc_only\": [\"extra_mesh\", ...]\n  }\n\"\"\"\n\nimport maya.cmds as cmds\nimport json\nfrom datetime import datetime\nfrom collections import OrderedDict\n\n\ndef get_meshes_under(group):\n    \"\"\"\n    递归获取 group 下所有 mesh transform。\n    返回: {short_name: {full_path, vertex_count}}\n    \"\"\"\n    result = OrderedDict()\n    if not cmds.objExists(group):\n        return result\n\n    # 如果 group 本身是 mesh transform\n    shapes = cmds.listRelatives(group, shapes=True, type='mesh', fullPath=False) or []\n    if shapes:\n        sn = group.split('|')[-1].split(':')[-1]  # 去命名空间\n        vtx = cmds.polyEvaluate(group, vertex=True)\n        result[sn] = {'full_path': group, 'vtx': vtx}\n\n    # 递归子节点\n    children = cmds.listRelatives(group, children=True, type='transform', fullPath=True) or []\n    for child in children:\n        result.update(get_meshes_under(child))\n\n    return result\n\n\ndef strip_namespace(name):\n    \"\"\"去掉命名空间前缀，如 Ahri_mod3:mesh_Geo → mesh_Geo\"\"\"\n    return name.split(':')[-1]\n\n\ndef get_transform(node):\n    \"\"\"获取节点 transform 数据，检查是否冻结\"\"\"\n    t = cmds.getAttr(node + '.t')[0]\n    r = cmds.getAttr(node + '.r')[0]\n    s = cmds.getAttr(node + '.s')[0]\n    frozen = (all(abs(v) < 1e-6 for v in t) and\n              all(abs(v) < 1e-6 for v in r) and\n              all(abs(v - 1) < 1e-6 for v in s))\n    return {\n        't': [round(v, 4) for v in t],\n        'r': [round(v, 4) for v in r],\n        's': [round(v, 4) for v in s],\n        'frozen': frozen,\n    }\n\n\ndef relative_path(full_path, root_path):\n    \"\"\"提取节点相对于根组的层级路径\"\"\"\n    parts = full_path.split('|')\n    root_name = root_path.split('|')[-1].split(':')[-1]\n    root_idx = 0\n    for i, p in enumerate(parts):\n        if p.split(':')[-1] == root_name:\n            root_idx = i\n            break\n    return '|'.join(parts[root_idx + 1:])\n\n\ndef get_sub_groups(root):\n    \"\"\"获取根组下所有子群组（不含mesh的空组）的相对路径\"\"\"\n    groups = []\n    root_name = root.split('|')[-1].split(':')[-1]\n    all_transforms = cmds.listRelatives(root, allDescendents=True, type='transform', fullPath=True) or []\n    for t in all_transforms:\n        shapes = cmds.listRelatives(t, shapes=True, type='mesh') or []\n        if shapes:\n            continue  # 跳过mesh节点\n        # 提取相对路径\n        parts = t.split('|')\n        ri = 0\n        for i, pt in enumerate(parts):\n            if pt.split(':')[-1] == root_name:\n                ri = i\n                break\n        groups.append('|'.join(parts[ri + 1:]))\n    return sorted(set(groups))\n\n\ndef diagnose(mod_group, abc_group):\n    \"\"\"\n    诊断 mod 组和 ABC 组的 mesh 对照关系。\n\n    参数:\n        mod_group: mod 模型的组名/顶级节点\n        abc_group: ABC 缓存的组名/顶级节点\n\n    返回:\n        dict: 结构化诊断结果\n    \"\"\"\n    print(\"=\" * 60)\n    print(\"  ABC blendShape 诊断\")\n    print(\"=\" * 60)\n\n    # 1. 收集两边 mesh\n    print(f\"\\n[1/4] 扫描 mod 组: {mod_group}\")\n    mod_raw = get_meshes_under(mod_group)\n    if not mod_raw:\n        cmds.warning(f\"mod 组 '{mod_group}' 下未找到 mesh！\")\n        return None\n    print(f\"  找到 {len(mod_raw)} 个 mesh\")\n\n    print(f\"\\n[2/4] 扫描 ABC 组: {abc_group}\")\n    abc_raw = get_meshes_under(abc_group)\n    if not abc_raw:\n        cmds.warning(f\"ABC 组 '{abc_group}' 下未找到 mesh！\")\n        return None\n    print(f\"  找到 {len(abc_raw)} 个 mesh\")\n\n    # 2. 按短名去命名空间后匹配\n    print(f\"\\n[3/4] 匹配 mesh 配对...\")\n    mod_by_short = {strip_namespace(k): v for k, v in mod_raw.items()}\n    abc_by_short = {strip_namespace(k): v for k, v in abc_raw.items()}\n\n    all_names = set(mod_by_short.keys()) | set(abc_by_short.keys())\n\n    pairs = []\n    mod_only = []\n    abc_only = []\n    ok_count = 0\n    mismatch_count = 0\n    not_frozen_count = 0\n    hierarchy_mismatch_count = 0\n\n    # 获取根组全路径 + 子群组\n    mod_root = cmds.ls(mod_group, long=True)[0]\n    abc_root = cmds.ls(abc_group, long=True)[0]\n\n    mod_grps = get_sub_groups(mod_root)\n    abc_grps = get_sub_groups(abc_root)\n    grp_only_mod = [g for g in mod_grps if g not in abc_grps]\n    grp_only_abc = [g for g in abc_grps if g not in mod_grps]\n    print(f\"\\n  子群组: mod {len(mod_grps)} 个, ABC {len(abc_grps)} 个\")\n    if grp_only_mod:\n        print(f\"  🏗 mod 独有子组: {', '.join(grp_only_mod)}\")\n    if grp_only_abc:\n        print(f\"  🏗 ABC 独有子组: {', '.join(grp_only_abc)}\")\n\n    for name in sorted(all_names):\n        in_mod = name in mod_by_short\n        in_abc = name in abc_by_short\n\n        if in_mod and in_abc:\n            mv = mod_by_short[name]['vtx']\n            av = abc_by_short[name]['vtx']\n            status = 'ok' if mv == av else 'mismatch'\n            if status == 'ok':\n                ok_count += 1\n            else:\n                mismatch_count += 1\n            # Transform 检查\n            xf = get_transform(mod_by_short[name]['full_path'])\n            if not xf['frozen']:\n                not_frozen_count += 1\n            # 层级对比\n            mp = relative_path(mod_by_short[name]['full_path'], mod_root)\n            ap = relative_path(abc_by_short[name]['full_path'], abc_root)\n            hm = mp == ap\n            if not hm:\n                hie
