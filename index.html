) {\n        $results_ok[$ok_count] = $i;\n        $ok_count++;\n        print (\"  [OK]   \" + $pairs_need_connect[$i][1] + \" | mod=\" + $mod_vtx + \" abc=\" + $abc_vtx + \"\\n\");\n    } else {\n        $results_bad[$bad_count] = $i;\n        $bad_count++;\n        print (\"  [MIS]  \" + $pairs_need_connect[$i][1] + \" | mod=\" + $mod_vtx + \" abc=\" + $abc_vtx + \"\\n\");\n    }\n}\n\nprint \"\\n========== 诊断结果 ==========\\n\";\nprint (\"顶点一致可连接: \" + $ok_count + \" 个\\n\");\nprint (\"顶点数不同无法连接: \" + $bad_count + \" 个\\n\");\nprint (\"\\n无法连接的 mesh (顶点数不匹配):\\n\");\nfor ($i = 0; $i < $bad_count; $i++) {\n    int $idx = $results_bad[$i];\n    print (\"  - \" + $pairs_need_connect[$idx][1] + \"\\n\");\n}\n\nprint (\"\\nABC中没有对应mesh、无法做BS的:\\n\");\nprint (\"  - Ahri_mao_03_Geo (ABC只有mao_04/05, 无mao_03)\\n\");\nprint (\"  - Ahri_head_Geo (ABC里没有单独的head mesh)\\n\");\nprint (\"  - Ahri_hair_01_Geo (ABC里没有)\\n\");\nprint (\"  - Ahri_xgen_liuhai_Geo (xgen, ABC里没有)\\n\");\nprint (\"  - Ahri_xgen_cefa_Geo (xgen, ABC里没有)\\n\");\nprint (\"  - Ahri_xgen_head_Geo (xgen, ABC里没有)\\n\");\nprint (\"  - Ahri_xgen_meimao_Geo (xgen, ABC里没有)\\n\");\nprint (\"  - Ahri_xgen_jiemao_Geo (xgen, ABC里没有)\\n\");\n\n// ---------- 第二步：确认后连接 ----------\nprint \"\\n========== 开始连接 ==========\\n\";\n\n// 先扩展 blendShape2 的 it 数组到 94\nint $current_it_size = `getAttr -size \"blendShape2.it\"`;\nprint (\"当前 blendShape2.it 大小: \" + $current_it_size + \"\\n\");\n\n// 只连接顶点数匹配的\nint $connected = 0;\nint $failed = 0;\n\nfor ($i = 0; $i < $ok_count; $i++) {\n    int $pair_idx = $results_ok[$i];\n    string $bs2_idx = $pairs_need_connect[$pair_idx][0];\n    string $abc_name = $pairs_need_connect[$pair_idx][2] + \"Shape\";\n    string $target_attr = \"blendShape2.it[\" + $bs2_idx + \"].itg[0].iti[6000].igt\";\n\n    // 检查是否已经连接\n    string $existing[] = `listConnections -source true -destination false $target_attr`;\n    if (size($existing) > 0) {\n        print (\"  [跳过] \" + $pairs_need_connect[$pair_idx][1] + \" 已有连接: \" + $existing[0] + \"\\n\");\n        continue;\n    }\n\n    // 确保 it 元素存在\n    if (`attributeExists \"it\" \"blendShape2\"`) {\n        // 连接 target\n        string $cmd = \"connectAttr \\\"\" + $abc_name + \".w\\\" \\\"\" + $target_attr + \"\\\"\";\n        int $result = `eval $cmd`;\n        if ($result) {\n            $connected++;\n            print (\"  [连接] \" + $pairs_need_connect[$pair_idx][1] + \" ← \" + $abc_name + \"\\n\");\n        } else {\n            $failed++;\n            print (\"  [失败] \" + $pairs_need_connect[$pair_idx][1] + \"\\n\");\n        }\n    } else {\n        print (\"  [错误] blendShape2.it 属性不存在\\n\");\n    }\n}\n\nprint \"\\n========== 连接完成 ==========\\n\";\nprint (\"成功连接: \" + $connected + \" 个\\n\");\nprint (\"失败: \" + $failed + \" 个\\n\");\n\n// 验证\nstring $new_it_size = `getAttr -size \"blendShape2.it\"`;\nprint (\"blendShape2.it 最终大小: \" + $new_it_size + \"\\n\");\n\nprint \"\\n========== 后续步骤提醒 ==========\\n\";\nprint \"1. 检查变形顺序: 选中任意 Ahri_mod3 mesh → All Inputs → \\n\";\nprint \"   确保 blendShape2 在 AlembicNode 上方(如果有ABC连到mod)\\n\";\nprint \"2. 对于顶点数不匹配的mesh，需要手动处理:\\n\";\nprint \"   - 检查是否mod和ABC版本不同\\n\";\nprint \"   - 或使用 wrap deformer 代替 blendShape\\n\";\nprint \"3. 对于ABC中没有的mesh (mao_03, head, hair_01, xgen):\\n\";\nprint \"   - mao_03 可能需要手动对应到 mao_04(如果它们是同一mesh的不同版本)\\n\";\nprint \"   - head/hair_01/xgen 在ABC里没有源，需要另外处理\\n\";\nprint \"4. 设置 blendShape 权重: setAttr \\\"blendShape2.Geometry\\\" 1;\\n\";\nprint \"========================================\\n\";\n"}], "methods": []}, {"software": "Maya", "subtag": "通用", "category": "成功", "name": "light-copy-and-rename", "description": "Maya 灯光工具 — 复制灯光组自动递增命名、查找修复重复命名灯光", "usage": ["# 复制灯光组（自动递增命名）\nexec(open(r'D:\\zcy\\ai_ty\\copy_light_group.py', encoding='utf-8').read())\n\n# 查找并修复重复灯光（支持仅检查/预览/修复三种模式）\nexec(open(r'D:\\zcy\\ai_ty\\fix_duplicate_light_names.py', encoding='utf-8').read())"], "files": [{"name": "copy_light_group.py", "path": "d:/zcy/ai_ty/copy_light_group.py"}, {"name": "fix_duplicate_light_names.py", "path": "d:/zcy/ai_ty/fix_duplicate_light_names.py"}], "package": "maya_light_tools.zip", "is_tracking": false, "errorPatterns": [], "embeddedScripts": [{"name": "copy_light_group.py", "content": "\"\"\"\nMaya 脚本 — 复制灯光组时，自动为组下所有子灯光递增命名。\n\n问题背景：\n  Maya 复制整个灯光组（group）时，组下的子灯光有时不会自动递增命名，\n  导致新复制的灯光与原始灯光重名，引发渲染层、AOV、灯光链接混乱。\n\n用法：\n  1. 在 Maya 视口或 Outliner 中选中要复制的灯光组/灯光\n  2. 在 Script Editor (Python 标签页) 中运行：\n        exec(open(r'D:\\\\zcy\\\\ai_ty\\\\copy_light_group.py', encoding='utf-8').read())\n  3. 脚本复制整个层级，并确保所有子灯光获得不重复的名称\n\n支持：\n  - Maya 原生灯光：ambientLight, directionalLight, pointLight, spotLight, areaLight, volumeLight\n  - Arnold 灯光：aiAreaLight, aiSkyDomeLight, aiLightPortal, aiPhotometricLight, aiMeshLight\n  - 深层嵌套组（组中组中组...中的灯光）\n  - 一次选中多个组同时复制\n\"\"\"\n\nimport maya.cmds as cmds\nimport re\n\n\n# ============================================================================\n# 工具函数\n# ============================================================================\n\ndef _is_light(node):\n    \"\"\"判断节点是否为灯光 transform（Maya原生 + Arnold + Redshift + V-Ray...）\"\"\"\n    if not cmds.objExists(node):\n        return False\n    shapes = cmds.listRelatives(node, shapes=True, fullPath=True) or []\n    for s in shapes:\n        if 'light' in cmds.nodeType(s).lower():\n            return True\n    return False\n\n\ndef _get_lights_under(root):\n    \"\"\"\n    递归获取 root 下所有灯光 transform 的全路径。\n    返回: [full_path, ...]\n    \"\"\"\n    result = []\n    if _is_light(root):\n        result.append(root)\n    children = cmds.listRelatives(root, children=True, type='transform', fullPath=True) or []\n    for child in children:\n        result.extend(_get_lights_under(child))\n    return result\n\n\ndef _short_name(full_path):\n    \"\"\"全路径 → 短名称\"\"\"\n    return full_path.split('|')[-1]\n\n\ndef _make_unique_name(name):\n    \"\"\"\n    确保名称在场景中唯一。\n    如果 name 已存在，自动递增数字后缀。\n    例：KeyLight → KeyLight1 → KeyLight2 ...\n    \"\"\"\n    if not cmds.objExists(name):\n        return name\n\n    m = re.match(r'^(.*?)(\\d*)$', name)\n    base = m.group(1)\n    suffix = m.group(2)\n\n    num = int(suffix) if suffix else 1\n    while cmds.objExists(f\"{base}{num}\"):\n        num += 1\n    return f\"{base}{num}\"\n\n\n# ============================================================================\n# 核心功能\n# ============================================================================\n\ndef copy_light_group():\n    \"\"\"\n    复制选中的灯光组，确保子灯光命名不重名。\n    \"\"\"\n    sel = cmds.ls(selection=True, type='transform')\n    if not sel:\n        cmds.warning(\"[copy_light] 请先选中要复制的灯光组或灯光！\")\n        return\n\n    results = []\n\n    for root in sel:\n        # 1. 记录原始灯光名称（短名），用于后续判断新灯光是否需要重命名\n        orig_lights = _get_lights_under(root)\n        orig_short_names = {_short_name(p) for p in orig_lights}\n        print(f\"[copy_light] 原始节点 '{_short_name(root)}' 下有 {len(orig_lights)} 个灯光\")\n\n        # 2. 执行复制\n        try:\n            new_nodes = cmds.duplicate(root, renameChildren=True)\n        except Exception as e:\n            cmds.warning(f\"[copy_light] 复制失败: {e}\")\n            continue\n\n        new_root = new_nodes[0]\n        print(f\"[copy_light] 新节点: '{_short_name(new_root)}'\")\n\n        # 3. 获取新组下的所有灯光（全路径）\n        new_lights = _get_lights_under(new_root)\n\n        # 4. 检查新灯光命名：如果短名称在原始灯光集合中，\n        #    说明 Maya 没有正确递增 → 手动重命名\n        renamed_count = 0\n        for full_path in new_lights:\n            sn = _short_name(full_path)\n            if sn in orig_short_names:\n                unique = _make_unique_name(sn)\n                try:\n                    actual = cmds.rename(full_path, unique)\n                    print(f\"[copy_light]   {sn} → {actual}\")\n                    renamed_count += 1\n                except Exception as e:\n                    cmds.warning(f\"[copy_light]   重命名 {full_path} 失败: {e}\")\n\n        if renamed_count == 0:\n            print(f\"[copy_light]   Maya 已自动递增，无需修复 ✓\")\n        else:\n            print(f\"[copy_light]   共修复 {renamed_count} 个灯光命名\")\n\n        results.append(new_root)\n\n    # 选中新创建的组\n    if results:\n        cmds.select(results)\n    print(f\"[copy_light] 完成！共复制 {len(results)} 个节点。\")\n    return results\n\n\n# ============================================================================\n# 入口\n# ============================================================================\n\nif __name__ == \"__main__\" or __name__ == \"__builtin__\":\n    copy_light_group()\n"}, {"name": "fix_duplicate_light_names.py", "content": "\"\"\"\nMaya 脚本 — 查找场景中重复命名的灯光，并自动修改为递增命名。\n\n问题背景：\n  复制灯光组或手动创建灯光时，可能出现多个灯光同名的情况。\n  Maya 不会自动报错，但会导致渲染层、AOV、灯光链接等混乱。\n\n用法：\n  Maya Script Editor (Python 标签页) 中运行：\n    exec(open(r'D:\\\\zcy\\\\ai_ty\\\\fix_duplicate_light_names.py', encoding='utf-8').read())\n\n功能：\n  - check_only()  — 仅检查并报告重复命名的灯光（不修改）\n  - fix()          — 查找重复命名的灯光并自动重命名为递增序号\n  - run()          — 一键检查 + 修复（默认入口）\n\n重命名规则：\n  场景中有 3 个名为 \"SpotLight1\" 的灯光 →\n    SpotLight1  (保留第一个)\n    SpotLight2  (第二个，自动找下一个可用编号)\n    SpotLight3  (第三个)\n\"\"\"\n\nimport maya.cmds as cmds\nimport re\nfrom collections import Counter\n\n\n# ============================================================================\n# 工具函数\n# ============================================================================\n\ndef _is_light_transform(node):\n    \"\"\"判断节点是否为灯光（Maya原生 + Arnold + Redshift + V-Ray...）\"\"\"\n    if not cmds.objExists(node):\n        return False\n    shapes = cmds.listRelatives(node, shapes=True, fullPath=True) or []\n    for s in shapes:\n        if 'light' in cmds.nodeType(s).lower():\n            return True\n    return False\n\n\ndef _get_all_lights():\n    \"\"\"获取场景中所有灯光 transform（Maya原生 + Arnold + Redshift + V-Ray...）\"\"\"\n    lights = set()\n    # Maya 原生灯光\n    for l in (cmds.ls(lights=True, long=True) or []):\n        lights.add(l)\n    # 所有含 light/light 的 shape 类型（覆盖 Arnold/Redshift/V-Ray 等）\n    all_shapes = cmds.ls(type='shape', long=True) or []\n    for s in all_shapes:\n        node_type = cmds.nodeType(s)\n        if 'light' in node_type.lower():\n            parent = cmds.listRelatives(s, parent=True, fullPath=True)\n            if parent:\n                lights.add(parent[0])\n    return list(lights)\n\n\ndef _is_referenced(node_name):\n    \"\"\"判断节点是否来自参考（reference）文件\"\"\"\n    if not cmds.objExists(node_name):\n        return True  # 不存在的节点跳过\n    try:\n        return cmds.referenceQuery(node_name, isNodeReferenced=True)\n    except RuntimeError:\n        return False\n\n\ndef _make_unique_name(name):\n    \"\"\"\n    根据名称生成场景中唯一的递增名称。\n    例如：KeyLight → 如果 KeyLight 已存在 → KeyLight1, KeyLight2...\n    \"\"\"\n    if not cmds.objExists(name):\n        return name\n\n    m = re.match(r'^(.*?)(\\d*)$', name)\n    base = m.group(1)\n    suffix = m.group(2)\n\n    num = int(suffix) if suffix else 1\n    while cmds.objExists(f\"{base}{num}\"):\n        num += 1\n    return f\"{base}{num}\"\n\n\n# ============================================================================\n# 核心功能\n# ============================================================================\n\ndef check_only():\n    \"\"\"\n    仅检查场景中的重复灯光命名，不执行任何修改。\n    返回重复名称列表。\n    \"\"\"\n    all_lights = _get_all_lights()\n\n    # 按短名统计，过滤参考节点\n    name_counts = Counter()\n    for full_path in all_lights:\n        short_name = full_path.split('|')[-1]\n        if not _is_referenced(short_name):\n            name_counts[short_name] += 1\n    duplicates = {name: count for name, count in name_counts.items() if count > 1}\n\n    if not duplicates:\n        print(\"[fix_light_name] ✅ 场景中没有重复命名的灯光。\")\n        return []\n\n    print(\"[fix_light_name] ⚠ 发现以下重复命名的灯光：\")\n    print(f\"  {'灯光名':<30} {'出现次数':>8}\")\n    print(f\"  {'-'*30} {'-'*8}\")\n    for name, count in sorted(duplicates.items()):\n        print(f\"  {name:<30} {count:>8}\")\n\n    print(f\"\\n[fix_light_name] 共 {len(duplicates)} 个名称重复，涉及 {sum(duplicates.values())} 个灯光。\")\n    print(\"[fix_light_name] 运行 fix() 可自动修复。\")\n    return list(duplicates.keys())\n\n\ndef fix(dry_run=False):\n    \"\"\"\n    修复场景中重复命名的灯光。\n\n    对于每组重名灯光：\n      - 保留第一个（序号最小或最先出现）\n      - 其余重命名为同系列的下一个可用编号\n\n    参数:\n        dry_run: True = 仅预览将要执行的重命名（不修改场景）\n    \"\"\"\n    all_lights = _get_all_lights()\n    # 按短名称分组\n    from collections import defaultdict\n    name_groups = defaultdict(list)\n\n    for full_path in all_lights:\n        short_name = full_path.split('|')[-1]\n        # 跳过参考节点\n        if _is_referenced(short_name):\n            continue\n        name_groups[short_name].append(full_path)\n\n    # 筛选出有重复的\n    duplicates = {n: paths for n, paths in name_groups.items() if len(paths) > 1}\n\n    if not duplicates:\n        print(\"[fix_light_name] ✅ 场景中没有重复命名的灯光。\")\n        return 0\n\n    print(\"[fix_light_name] 开始修复重复灯光命名...\")\n    print(f\"[fix_light_name] 发现 {len(duplicates)} 组重名灯光\\n\")\n\n    fixed_count = 0\n\n    for short_name, paths in sorted(duplicates.items()):\n        print(f\"  重名组: '{short_name}' ({len(paths)} 个实例)\")\n\n        # 保留第一个，其余重命名\n        keep = paths[0]\n        to_rename = paths[1:]\n\n        print(f\"    保留: {keep}\")\n\n        for old_full in to_rename:\n            # 生成唯一名称\n            new_name = _make_unique_name(short_name)\n\n            if dry_run:\n                print(f\"    [预览] {old_full} → {new_name}\")\n            else:\n                try:\n                    actual = cmds.rename(old_full, new_name)\n                    print(f\"    已重命名: {old_full.split('|')[-1]} → {actual}\")\n                    fixed_count += 1\n                except Exception as e:\n                    cmds.warning(f\"[fix_light_name] 重命名失败: {old_full} → {new_name}, 错误: {e}\")\n\n        print()\n\n    if dry_run:\n        print(f\"[fix_light_name] [预览模式] 将重命名 {fixed_count} 个灯光（未实际修改）\")\n    else:\n        print(f\"[fix_light_name] ✅ 修复完成！共重命名 {fixed_count} 个灯光。\")\n\n    return fixed_count\n\n\n# ============================================================================\n# 一键运行\n# ============================================================================\n\ndef run():\n    \"\"\"\n    一键检查 + 修复：先展示重复灯光，再执行重命名。\n    \"\"\"\n    print(\"=\" * 60)\n    print(\"Maya 灯光重复命名检测与修复工具\")\n    print(\"=\" * 60)\n    print()\n\n    dup_list = check_only()\n    if not dup_list:\n        return\n\n    print()\n    answer = input(\"[fix_light_name] 是否修复以上重复命名？(y/n): \").strip().lower()\n    if answer == 'y':\n        fix()\n    else:\n        print(\"[fix_light_name] 已取消，未做任何修改。\")\n\n\n# ============================================================================\n# 入口\n# ============================================================================\n\nif __name__ == \"__main__\" or __name__ == \"__builtin__\":\n    # 直接运行时：先检查再修复\n    dup_list = check_only()\n    if dup_list:\n        print()\n        fix()\n"}], "methods": [{"name": "复制灯光组（自动递增命名）", "pros": ["一条命令，复制即用"], "cons": ["需在 Script Editor 中运行"], "color": "#b8a99a", "code": "exec(open(r'D:\\zcy\\ai_ty\\copy_light_group.py', encoding='utf-8').read())"}, {"name": "查找并修复重复灯光（支持仅检查/预览/修复三种模式）", "pros": ["一条命令，复制即用"], "cons": ["需在 Script Editor 中运行"], "color": "#9cadb0", "code": "exec(open(r'D:\\zcy\\ai_ty\\fix_duplicate_light_names.py', encoding='utf-8').read())"}]}, {"software": "Maya", "subtag": "通用", "category": "成功", "name": "Render Queue 渲染队列", "description": "Maya 渲染队列管理器 — 独立桌面App，commandPort控制Maya批量渲染", "usage": [], "files": [{"name": "maya_render_queue/main.py", "path": "d:/zcy/ai_ty/maya_render_queue/main.py"}, {"name": "maya_render_queue/run.bat", "path": "d:/zcy/ai_ty/maya_render_queue/run.bat"}, {"name": "app/executor.py", "path": "d:/zcy/ai_ty/maya_render_queue/app/executor.py"}, {"name": "app/gui.py", "path": "d:/zcy/ai_ty/maya_render_queue/app/gui.py"}, {"name": "app/job_model.py", "path": "d:/zcy/ai_ty/maya_render_queue/app/job_model.py"}, {"name": "app/queue_manager.py", "path": "d:/zcy/ai_ty/maya_render_queue/app/queue_manager.py"}], "package": "maya_render_queue.zip", "is_tracking": false, "errorPatterns": [], "embeddedScripts": [{"name": "maya_render_queue/main.py", "content": "\"\"\"\nMaya Render Queue — 入口\n启动方式:\n    mayapy main.py\n    或双击 run.bat\n\"\"\"\nimport os\nimport sys\n\nAPP_DIR = os.path.dirname(os.path.abspath(__file__))\nif APP_DIR not in sys.path:\n    sys.path.insert(0, APP_DIR)\n\nfrom PySide2 import QtWidgets\n\nfrom app.theme import QT_STYLESHEET\nfrom app.queue_manager import QueueManager\nfrom app.maya_detector import detect_maya_versions\nfrom app.gui import MainWindow\n\n\ndef main():\n    print(\"检测 Maya 安装...\")\n    maya_versions = detect_maya_versions()\n\n    if not maya_versions:\n        print(\"警告: 未检测到已安装的 Maya\")\n        maya_versions = [{\n            \"version\": \"2022\",\n            \"path\": \"\",\n            \"mayabatch\": \"mayabatch.exe\",\n            \"render_exe\": \"\",\n            \"mayapy\": \"\",\n        }]\n\n    print(f\"找到 {len(maya_versions)} 个 Maya 版本: {[v['version'] for v in maya_versions]}\")\n\n    qm = QueueManager()\n    qm.load()\n    print(f\"已加载 {qm.count} 个渲染任务\")\n\n    app = QtWidgets.QApplication(sys.argv)\n    app.setStyle(\"Fusion\")\n    app.setStyleSheet(QT_STYLESHEET)\n\n    window = MainWindow(qm, maya_versions)\n    window.show()\n\n    sys.exit(app.exec_())\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"name": "app/executor.py", "content": "\"\"\"\n渲染执行引擎 — 通过 Maya commandPort 控制已运行的 Maya\n\"\"\"\nimport os, json, time, socket, threading, traceback\n\nPORT = 7778\nHOST = \"127.0.0.1\"\n\n\ndef _logs_dir():\n    return os.path.join(os.path.dirname(os.path.dirname(__file__)), \"logs\")\n\n\nclass RenderExecutor:\n    def __init__(self, queue_manager, maya_versions, log_callback=None, status_callback=None):\n        self.qm = queue_manager\n        self.maya_versions = maya_versions\n        self.log = log_callback or (lambda msg: None)\n        self.on_status = status_callback or (lambda j, s: None)\n        self._thread = None\n        self._stop_flag = False\n        self._sock = None\n\n    def start(self):\n        if self._thread and self._thread.is_alive():\n            self.log(\"[警告] 已有渲染线程在运行\")\n            return\n        self._stop_flag = False\n        def _safe():\n            try: self._run_queue()\n            except Exception as e:\n                self.log(f\"[崩溃] {e}\\n{traceback.format_exc()}\")\n        self._thread = threading.Thread(target=_safe, daemon=True)\n        self._thread.start()\n\n    def stop(self):\n        self._stop_flag = True\n        self.log(\"[RenderQueue] 停止...\")\n        try:\n            if self._sock: self._sock.close()\n        except: pass\n\n    def is_running(self):\n        return self._thread is not None and self._thread.is_alive()\n\n    def _connect(self):\n        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n        s.settimeout(5)\n        s.connect((HOST, PORT))\n        self._sock = s\n\n    def _cmd(self, code):\n        if not self._sock: raise Exception(\"未连接\")\n        self._sock.sendall((code + \"\\n\").encode(\"utf-8\"))\n\n    def _run_queue(self):\n        jobs = [j for j in self.qm.all if j.status == \"pending\"]\n        if not jobs:\n            self.log(\"[RenderQueue] 没有待渲染的任务\")\n            return\n        self.log(f\"[RenderQueue] 连接 Maya...\")\n        try:\n            self._connect()\n            self.log(\"[RenderQueue] 已连接 Maya\")\n        except Exception as e:\n            self.log(f\"[RenderQueue] 连接失败: {e}\")\n            return\n\n        total = len(jobs)\n        self.log(f\"[RenderQueue] 开始队列，共 {total} 个任务\")\n        self.log(\"-\" * 50)\n        for i, job in enumerate(jobs):\n            if self._stop_flag:\n                self.log(\"[RenderQueue] 队列已停止\")\n                break\n            self.log(f\"[{i+1}/{total}] {job.name}\")\n            try:\n                self._run_single(job)\n            except Exception as e:\n                self.log(f\"  [异常] {e}\")\n                self.on_status(job.id, \"error\")\n        try: self._sock.close()\n        except: pass\n        self._sock = None\n        self.log(\"-\" * 50)\n        self.log(\"[RenderQueue] 队列执行完毕\")\n\n    def _run_single(self, job):\n        self.on_status(job.id, \"running\")\n        t0 = time.time()\n        r = job.renderer\n        fp = job.file_path.replace(\"\\\\\", \"/\")\n        layers = job.render_layers or [\"defaultRenderLayer\"]\n\n        # 1. 打开目标文件\n        self.log(f\"  [1/3] 打开: {os.path.basename(job.file_path)}\")\n        self._cmd(f\"cmds.file(r'{fp}', open=True, force=True)\")\n        self.log(\"  等待加载 (60s)...\")\n        time.sleep(60)\n        self.log(\"  就绪\")\n\n        # 2. 设置参数\n        self.log(\"  [2/3] 设置参数...\")\n        for p in [\n            f\"cmds.setAttr('defaultRenderGlobals.startFrame', {job.start_frame})\",\n            f\"cmds.setAttr('defaultRenderGlobals.endFrame', {job.end_frame})\",\n            f\"cmds.setAttr('defaultRenderGlobals.byFrameStep', {job.step})\",\n            \"cmds.setAttr('defaultRenderGlobals.animation', 1)\",\n            f\"cmds.setAttr('defaultResolution.width', {job.width})\",\n            f\"cmds.setAttr('defaultResolution.height', {job.height})\",\n            f\"cmds.setAttr('defaultRenderGlobals.currentRenderer', '{r}', type='string')\",\n            \"cmds.setAttr('defaultRenderGlobals.imageFormat', 51)\",\n        ]:\n            self._cmd(p)\n            time.sleep(0.2)\n\n        if job.output_path:\n            safe = job.output_path.replace(\"\\\\\", \"/\")\n            self._cmd(f\"cmds.workspace(fileRuleEntry='{safe}')\")\n            self._cmd(f\"cmds.setAttr('defaultRenderGlobals.imageFilePrefix', '{safe}/<Scene>/<RenderLayer>/<RenderLayer>', type='string')\")\n            time.sleep(0.2)\n\n        if r == \"redshift\":\n            self._cmd(f\"cmds.setAttr('redshiftOptions.unifiedMaxSamples', {job.rs_samples})\")\n        elif r == \"arnold\":\n            self._cmd(\"cmds.setAttr('defaultArnoldDriver.mergeAOVs', 1)\")\n            self._cmd(f\"cmds.setAttr('defaultArnoldRenderOptions.AASamples', {job.arnold_aa})\")\n            self._cmd(f\"cmds.setAttr('defaultArnoldRenderOptions.GIDiffuseSamples', {job.arnold_diffuse})\")\n            self._cmd(f\"cmds.setAttr('defaultArnoldRenderOptions.GISpecularSamples', {job.arnold_specular})\")\n            self._cmd(f\"cmds.setAttr('defaultArnoldRenderOptions.GITransmissionSamples', {job.arnold_transmission})\")\n            self._cmd(f\"cmds.setAttr('defaultArnoldRenderOptions.GISssSamples', {job.arnold_sss})\")\n            self._cmd(f\"cmds.setAttr('defaultArnoldRenderOptions.GIVolumeSamples', {job.arnold_volume})\")\n\n        # 渲染层：写到临时文件让 Maya exec，避免转义和 scope 问题\n        py_path = os.path.join(_logs_dir(), f\"layers_{job.id}.py\").replace(\"\\\\\", \"/\")\n        with open(py_path, \"w\", encoding=\"utf-8\") as f:\n            f.write(\n                f\"import maya.cmds as cmds\\n\"\n                f\"import maya.app.renderSetup.model.renderSetup as _rs\\n\"\n                f\"_rql = {json.dumps(layers)}\\n\"\n                f\"_all = _rs.instance().getRenderLayers()\\n\"\n                f\"for _l in (_all or []):\\n\"\n                f\"    try:\\n\"\n                f\"        _l.setRenderable(_l.name() in _rql)\\n\"\n                f\"    except Exception as _e:\\n\"\n                f\"        cmds.warning('layer error: ' + str(_e))\\n\"\n                f\"cmds.file(modified=True)\\n\"\n            )\n        self._cmd(f\"exec(open(r'{py_path}', encoding='utf-8').read())\")\n        time.sleep(2)\n\n        # 3. 保存 + 提交渲染 + 等完成\n        self.log(\"  保存并提交渲染...\")\n        # 渲染完成标记：postRenderMel 创建 done 文件\n        done_file = os.path.join(_logs_dir(), f\"done_{job.id}.txt\").replace(\"\\\\\", \"/\")\n        try: os.remove(done_file)\n        except: pass\n        mel_val = f'python(\"open(r\\'{done_file}\\', \\'w\\').close()\")'\n        self._cmd(f\"cmds.setAttr('defaultRenderGlobals.postRenderMel', {repr(mel_val)}, type='string')\")\n        time.sleep(1)\n        self._cmd(\"cmds.file(save=True, force=True)\")\n        time.sleep(3)\n        self.log(f\"  [3/3] BatchRender: {r}\")\n        if r == \"arnold\":\n            self._cmd(\"import maya.mel as _mel; _mel.eval('BatchRender')\")\n        elif r == \"redshift\":\n            self._cmd(\"import maya.mel as _mel; _mel.eval('rsRender -batch -render;')\")\n\n        # 等完成标记文件出现\n        self.log(f\"  等待渲染完成...\")\n        waited = 0\n        while waited < 28800 and not self._stop_flag:\n            time.sleep(30)\n            waited += 30\n            if os.path.isfile(done_file):\n                self.log(\"  渲染完成\")\n                os.remove(done_file)\n                break\n\n        # 开空场景清状态\n        self.log(\"  打开空场景...\")\n        self._cmd(\"cmds.file(new=True, force=True)\")\n        time.sleep(2)\n\n        elapsed = time.time() - t0\n        self.log(f\"  完成，耗时 {self._ft(elapsed)}\")\n        self.on_status(job.id, \"done\")\n\n    @staticmethod\n    def _ft(seconds):\n        h, r = divmod(int(seconds), 3600)\n        m, s = divmod(r, 60)\n        if h: return f\"{h}h{m}m{s}s\"\n        if m: return f\"{m}m{s}s\"\n        return f\"{s}s\"\n"}, {"name": "app/gui.py", "content": "\"\"\"\nGUI — PySide2 主窗口 + 任务编辑对话框 + 日志面板\n\"\"\"\nimport os\nimport sys\nfrom PySide2 import QtWidgets, QtCore, QtGui\n\nfrom .theme import QT_STYLESHEET\nfrom .job_model import RenderJob\nfrom .executor import RenderExecutor\nfrom .maya_detector import detect_renderer_from_file, read_scene_settings, parse_ma_settings\n\n\nRES_PRESETS = [\n    (\"3840x2160 (4K)\",   3840, 2160),\n    (\"2560x1440 (2K)\",   2560, 1440),\n    (\"1920x1080 (1080p)\",1920, 1080),\n    (\"1280x720 (720p)\",  1280, 720),\n    (\"自定义\",            None, None),\n]\n\nSTATUS_LABELS = {\n    \"pending\": \"等待中\",\n    \"running\": \"渲染中 ▶\",\n    \"done\":    \"已完成 ✓\",\n    \"error\":   \"错误 ✗\",\n}\n\nSTATUS_COLORS = {\n    \"pending\": \"#d4a844\",\n    \"running\": \"#5a9ec9\",\n    \"done\":    \"#6bbf6b\",\n    \"error\":   \"#e05555\",\n}\n\n\n# ════════════════════════════════════════════════════════════\n# 主窗口\n# ════════════════════════════════════════════════════════════\n\nclass MainWindow(QtWidgets.QMainWindow):\n    def __init__(self, queue_manager, maya_versions):\n        super().__init__()\n        self.qm = queue_manager\n        self.maya_versions = maya_versions\n        self._ver_map = {v[\"version\"]: v for v in maya_versions}\n\n        self.setWindowTitle(\"Maya Render Queue\")\n        self.resize(960, 680)\n        self.setMinimumSize(800, 500)\n\n        # 消息队列：线程安全传递日志\n        import queue\n        self._msg_queue = queue.Queue()\n        self._msg_timer = QtCore.QTimer()\n        self._msg_timer.timeout.connect(self._drain_queue)\n        self._msg_timer.start(300)  # 每 300ms 检查队列\n\n        self.executor = RenderExecutor(\n            queue_manager=self.qm,\n            maya_versions=self._ver_map,\n            log_callback=self._msg_queue.put,\n            status_callback=lambda j, s: self._msg_queue.put((\"status\", j, s)),\n        )\n\n        self._build_ui()\n        self._refresh_list()\n        self.qm.set_on_change(lambda: QtCore.QTimer.singleShot(0, self._refresh_list))\n\n    def _build_ui(self):\n        central = QtWidgets.QWidget()\n        self.setCentralWidget(central)\n        layout = QtWidgets.QVBoxLayout(central)\n        layout.setContentsMargins(12, 10, 12, 10)\n        layout.setSpacing(6)\n\n        # ── 工具栏 ──\n        toolbar = QtWidgets.QHBoxLayout()\n        toolbar.setSpacing(4)\n\n        btn_add = QtWidgets.QPushButton(\"＋ 添加文件\")\n        btn_add.clicked.connect(self._add_job)\n        toolbar.addWidget(btn_add)\n\n        btn_edit = QtWidgets.QPushButton(\"✎ 编辑\")\n        btn_edit.clicked.connect(self._edit_job)\n        toolbar.addWidget(btn_edit)\n\n        btn_del = QtWidgets.QPushButton(\"✕ 删除\")\n        btn_del.clicked.connect(self._delete_job)\n        toolbar.addWidget(btn_del)\n\n        line = QtWidgets.QFrame()\n        line.setFrameShape(QtWidgets.QFrame.VLine)\n        toolbar.addWidget(line)\n\n        btn_up = QtWidgets.QPushButton(\"↑ 上移\")\n        btn_up.clicked.connect(self._move_up)\n        toolbar.addWidget(btn_up)\n\n        btn_down = QtWidgets.QPushButton(\"↓ 下移\")\n        btn_down.clicked.connect(self._move_down)\n        toolbar.addWidget(btn_down)\n\n        toolbar.addStretch()\n\n        self._count_label = QtWidgets.QLabel()\n        toolbar.addWidget(self._count_label)\n\n        layout.addLayout(toolbar)\n\n        # ── Maya 连接提示 ──\n        hint = QtWidgets.QLabel(\n            'Maya: import maya.cmds as cmds; cmds.commandPort(name=\":7778\", sourceType=\"python\")'\n        )\n        hint.setStyleSheet(\n            \"background-color: #2a2a3a; color: #d4a844; padding: 4px 10px;\"\n            \"font-family: Consolas; font-size: 11px; border-radius: 3px;\"\n        )\n        hint.setTextInteractionFlags(QtCore.Qt.TextSelectableByMouse)\n        layout.addWidget(hint)\n\n        # ── 队列列表 ──\n        self.tree = QtWidgets.QTreeWidget()\n        self.tree.setHeaderLabels([\"名称\", \"渲染器\", \"帧范围\", \"尺寸\", \"Maya\", \"状态\"])\n        self.tree.setRootIsDecorated(False)\n        self.tree.setSelectionMode(QtWidgets.QAbstractItemView.SingleSelection)\n        self.tree.setSelectionBehavior(QtWidgets.QAbstractItemView.SelectRows)\n        self.tree.setAlternatingRowColors(True)\n        self.tree.setColumnWidth(0, 260)\n        self.tree.setColumnWidth(1, 80)\n        self.tree.setColumnWidth(2, 80)\n        self.tree.setColumnWidth(3, 70)\n        self.tree.setColumnWidth(4, 60)\n        self.tree.setColumnWidth(5, 80)\n        self.tree.header().setStretchLastSection(False)\n        self.tree.header().setSectionResizeMode(0, QtWidgets.QHeaderView.Stretch)\n        self.tree.doubleClicked.connect(self._edit_job)\n        self.tree.setContextMenuPolicy(QtCore.Qt.CustomContextMenu)\n        self.tree.customContextMenuRequested.connect(self._on_context_menu)\n        self._current_job_id = None\n        self.tree.currentItemChanged.connect(self._on_current_changed)\n        layout.addWidget(self.tree, 1)\n\n        # ── 底部控制 ──\n        ctrl = QtWidgets.QHBoxLayout()\n        ctrl.setSpacing(8)\n\n        self._start_btn = QtWidgets.QPushButton(\"▶ 开始渲染队列\")\n        self._start_btn.setObjectName(\"startBtn\")\n        self._start_btn.clicked.connect(self._start_queue)\n        ctrl.addWidget(self._start_btn)\n\n        self._stop_btn = QtWidgets.QPushButton(\"■ 停止\")\n        self._stop_btn.setObjectName(\"stopBtn\")\n        self._stop_btn.setEnabled(False)\n        self._stop_btn.clicked.connect(self._stop_queue)\n        ctrl.addWidget(self._stop_btn)\n\n        ctrl.addStretch()\n\n        self._progress_label = QtWidgets.QLabel()\n        ctrl.addWidget(self._progress_label)\n\n        layout.addLayout(ctrl)\n\n        # ── 日志 ──\n        log_group = QtWidgets.QGroupBox(\"日志\")\n        log_ly = QtWidgets.QVBoxLayout(log_group)\n        log_ly.setContentsMargins(4, 4, 4, 4)\n\n        self.log_text = QtWidgets.QPlainTextEdit()\n        self.log_text.setReadOnly(True)\n        self.log_text.setMaximumBlockCount(2000)\n        self.log_text.setFont(QtGui.QFont(\"Consolas\", 9))\n        log_ly.addWidget(self.log_text)\n\n        layout.addWidget(log_group)\n\n        # ── 脚本执行区域 ──\n        script_group = QtWidgets.QGroupBox(\"脚本执行（粘贴 Python 代码，通过 mayapy 运行）\")\n        script_ly = QtWidgets.QVBoxLayout(script_group)\n        script_ly.setContentsMargins(4, 4, 4, 4)\n\n        script_row = QtWidgets.QHBoxLayout()\n        self._script_edit = QtWidgets.QPlainTextEdit()\n        self._script_edit.setPlaceholderText(\"粘贴 Python 脚本...\")\n        self._script_edit.setMaximumBlockCount(100)\n        self._script_edit.setFont(QtGui.QFont(\"Consolas\", 9))\n        self._script_edit.setFixedHeight(60)\n        script_row.addWidget(self._script_edit, 1)\n\n        btn_run = QtWidgets.QPushButton(\"▶ 执行\")\n        btn_run.clicked.connect(self._run_script)\n        btn_run.setFixedWidth(70)\n        btn_run.setFixedHeight(60)\n        script_row.addWidget(btn_run)\n\n        script_ly.addLayout(script_row)\n        layout.addWidget(script_group)\n\n        # 启动日志\n        self._append_log(\"Maya Render Queue 启动\")\n        self._append_log(f\"检测到 Maya 版本: {[v['version'] for v in self.maya_versions]}\")\n\n    def _drain_queue(self):\n        while not self._msg_queue.empty():\n            try:\n                msg = self._msg_queue.get_nowait()\n                if isinstance(msg, tuple) and len(msg) == 3 and msg[0] == \"status\":\n                    self.qm.set_status(msg[1], msg[2])\n                elif isinstance(msg, str):\n                    self.log_text.appendPlainText(msg)\n            except:\n                pass\n\n    def _append_log(self, msg):\n        self._msg_queue.put(msg)\n\n    def _run_script(self):\n        \"\"\"在 mayapy 中执行用户粘贴的脚本，输出到日志\"\"\"\n        code = self._script_edit.toPlainText().strip()\n        if not code:\n            return\n\n        mayapy = None\n        for mv in self.maya_versions:\n            p = mv.get(\"mayapy\", \"\")\n            if os.path.isfile(p):\n                mayapy = p\n                break\n        if not mayapy:\n            self._append_log(\"[脚本] 错误: 未找到 mayapy\")\n            return\n\n        self._append_log(\"[脚本] === 执行 ===\")\n        import subprocess\n        import os as _os\n\n        _log_dir = _os.path.join(_os.path.dirname(_os.path.dirname(__file__)), \"logs\")\n        _os.makedirs(_log_dir, exist_ok=True)\n        script_path = _os.path.join(_log_dir, \"_user_script.py\")\n        with open(script_path, \"w\", encoding=\"utf-8\") as f:\n            f.write(code)\n\n        try:\n            proc = subprocess.run(\n                [mayapy, script_path],\n                capture_output=True, text=True, timeout=60,\n            )\n            out = (proc.stdout or \"\").strip()\n            err = (proc.stderr or \"\").strip()\n            if out:\n                for line in out.split(\"\\n\")[:100]:\n                    self._append_log(f\"[脚本] {line}\")\n            if err:\n                for line in err.split(\"\\n\")[:50]:\n                    self._append_log(f\"[脚本][ERR] {line}\")\n            if not out and not err:\n                self._append_log(\"[脚本] (无输出)\")\n            self._append_log(f\"[脚本] 退出码: {proc.returncode}\")\n        except subprocess.TimeoutExpired:\n            self._append_log(\"[脚本] 超时 (60s)\")\n        except Exception as e:\n            self._append_log(f\"[脚本] 异常: {e}\")\n\n    def _refresh_list(self, *args):\n        self.tree.clear()\n        jobs = self.qm.all\n        self._job_order = [j.id for j in jobs]  # 并行列表：按行号存 job ID\n\n        for j in jobs:\n            item = QtWidgets.QTreeWidgetItem()\n            item.setText(0, j.name if j.name else j.file_name)\n            item.setText(1, j.renderer.capitalize())\n            item.setText(2, j.frame_range_label)\n            item.setText(3, j.resolution_label)\n            item.setText(4, j.maya_version)\n\n            status_text = STATUS_LABELS.get(j.status, j.status)\n            item.setText(5, status_text)\n\n            color = STATUS_COLORS.get(j.status, \"#e0e0e0\")\n            item.setForeground(5, QtGui.QColor(color))\n\n            self.tree.addTopLevelItem(item)\n\n        self._count_label.setText(f\"共 {len(jobs)} 个任务\")\n\n        running = self.executor.is_running()\n        has_pending = any(j.status == \"pending\" for j in jobs)\n        self._start_btn.setEnabled(has_pending and not running)\n        self._stop_btn.setEnabled(running)\n\n        done = sum(1 for j in jobs if j.status in (\"done\", \"error\"))\n        if running and jobs:\n            self._progress_label.setText(f\"进度: {done}/{len(jobs)}\")\n        elif not running and jobs:\n            self._progress_label.setText(f\"就绪: {len(jobs)} 个任务\")\n        else:\n            self._progress_label.setText(\"\")\n\n    def _on_job_status(self, job_id, status):\n        self.qm.set_status(job_id, status)\n\n    def _on_context_menu(self, pos):\n        ids = self._selected_ids()\n        if not ids:\n            return\n        job = self.qm.get(ids[0])\n        if not job:\n            return\n        menu = QtWidgets.QMenu(self)\n        if job.status in (\"error\", \"done\"):\n            act_retry = menu.addAction(\"重试\")\n            act_retry.triggered.connect(lambda: self._retry_job(ids[0]))\n        if job.status == \"running\":\n            act_stop = menu.addAction(\"停止\")\n            act_stop.triggered.connect(lambda: self._stop_queue())\n        menu.addSeparator()\n        act_edit = menu.addAction(\"编辑\")\n        act_edit.triggered.connect(self._edit_job)\n        act_del = menu.addAction(\"删除\")\n        act_del.triggered.connect(self._delete_job)\n        menu.exec_(self.tree.mapToGlobal(pos))\n\n    def _retry_job(self, job_id):\n        self.qm.set_status(job_id, \"pending\")\n        self._append_log(f\"[重试] {self.qm.get(job_id).name}\")\n\n    def _on_current_changed(self, current, previous):\n        if current:\n            idx = self.tree.indexOfTopLevelItem(current)\n            if 0 <= idx < len(self._job_order):\n                self._current_job_id = self._job_order[idx]\n            else:\n                self._current_job_id = None\n        else:\n            self._current_job_id = None\n\n    def _selected_ids(self):\n        ids = []\n        for item in self.tree.selectedItems():\n            idx = self.tree.indexOfTopLevelItem(item)\n            if 0 <= idx < len(self._job_order):\n                ids.append(self._job_order[idx])\n        if not ids and self._current_job_id:\n            ids.append(self._current_job_id)\n        return ids\n\n    def _add_job(self):\n        dialog = JobEditDialog(self, self.maya_versions, title=\"添加渲染任务\")\n        if dialog.exec_() == QtWidgets.QDialog.Accepted:\n            self.qm.add(dialog.result)\n            self._append_log(f\"[添加] {dialog.result.name}\")\n\n    def _edit_job(self):\n        ids = self._selected_ids()\n        if not ids:\n            QtWidgets.QMessageBox.information(self, \"提示\", \"请先在队列中选择一个任务\")\n            return\n        job = self.qm.get(ids[0])\n        if not job:\n            return\n        dialog = JobEditDialog(self, self.maya_versions, job=job, title=\"编辑渲染任务\")\n        if dialog.exec_() == QtWidgets.QDialog.Accepted:\n            r = dialog.result\n            self.qm.update(job.id,\n                name=r.name, file_path=r.file_path,\n                maya_version=r.maya_version, renderer=r.renderer,\n                start_frame=r.start_frame, end_frame=r.end_frame,\n                step=r.step, width=r.width, height=r.height,\n                rs_samples=r.rs_samples, rs_threshold=r.rs_threshold,\n                arnold_aa=r.arnold_aa, arnold_diffuse=r.arnold_diffuse,\n                arnold_specular=r.arnold_specular,\n                arnold_transmission=r.arnold_transmission,\n                arnold_sss=r.arnold_sss, arnold_volume=r.arnold_volume,\n                output_path=r.output_path, render_layers=r.render_layers,\n            )\n            self._append_log(f\"[编辑] {r.name}\")\n\n    def _delete_job(self):\n        ids = self._selected_ids()\n        if not ids:\n            QtWidgets.QMessageBox.information(self, \"提示\", \"请先在队列中选择一个任务\")\n            return\n        reply = QtWidgets.QMessageBox.question(\n            self, \"确认删除\", f\"确定要删除选中的 {len(ids)} 个任务吗？\",\n            QtWidgets.QMessageBox.Yes | QtWidgets.QMessageBox.No,\n        )\n        if reply == QtWidgets.QMessageBox.Yes:\n            self.qm.remove_many(ids)\n\n    def _move_up(self):\n        ids = self._selected_ids()\n        if ids: self.qm.move_up(ids[0])\n\n    def _move_down(self):\n        ids = self._selected_ids()\n        if ids: self.qm.move_down(ids[0])\n\n    def _start_queue(self):\n        if self.executor.is_running(): return\n        pending = self.qm.pending\n        if not pending:\n            QtWidgets.QMessageBox.information(self, \"提示\", \"没有待渲染的任务\")\n            return\n        self._append_log(\"=\" * 50)\n        self.executor.start()\n        self._refresh_list()\n\n    def _stop_queue(self):\n        self.executor.stop()\n        self._refresh_list()\n\n    def closeEvent(self, event):\n        if self.executor.is_running():\n            reply = QtWidgets.QMessageBox.question(\n                self, \"确认退出\", \"有任务正在渲染中，确定要退出吗？\",\n                QtWidgets.QMessageBox.Yes | QtWidgets.QMessageBox.No,\n            )\n            if reply != QtWidgets.QMessageBox.Yes:\n                event.ignore()\n                return\n            self.executor.stop()\n        event.accept()\n\n\n# ════════════════════════════════════════════════════════════\n# 任务编辑对话框\n# ════════════════════════════════════════════════════════════\n\nclass JobEditDialog(QtWidgets.QDialog):\n    def __init__(self, parent, maya_versions, job=None, title=\"编辑任务\"):\n        super().__init__(parent)\n        self.maya_versions = maya_versions\n        self.job = job\n        self.result = None\n\n        self.setWindowTitle(title)\n        self.setMinimumWidth(550)\n        self.setModal(True)\n\n        self._build_form()\n        if job:\n            self._fill_from_job()\n\n    def _build_form(self):\n        layout = QtWidgets.QVBoxLayout(self)\n        layout.setSpacing(8)\n        layout.setContentsMargins(16, 14, 16, 14)\n\n        # ── 滚动区域（内容多的时候） ──\n        scroll = QtWidgets.QScrollArea()\n        scroll.setWidgetResizable(True)\n        scroll.setFrameShape(QtWidgets.QFrame.NoFrame)\n        inner = QtWidgets.QWidget()\n        form = QtWidgets.QVBoxLayout(inner)\n        form.setSpacing(8)\n\n        def add_row(label_text, widget, parent_layout=None):\n            row = QtWidgets.QHBoxLayout()\n            lbl = QtWidgets.QLabel(label_text)\n            lbl.setFixedWidth(80)\n            row.addWidget(lbl)\n            row.addWidget(widget, 1)\n            (parent_layout or form).addLayout(row)\n\n        def add_label(text):\n            lbl = QtWidgets.QLabel(text)\n            lbl.setStyleSheet(\"font-weight: bold; color: #aaa; margin-top: 4px;\")\n            (form).addWidget(lbl)\n\n        # ── Maya 文件 ──\n        add_label(\"Maya 文件\")\n        path_row = QtWidgets.QHBoxLayout()\n        self._file_edit = QtWidgets.QLineEdit()\n        self._file_edit.setPlaceholderText(\"选择 .ma 或 .mb 文件...\")\n        path_row.addWidget(self._file_edit, 1)\n        btn_browse = QtWidgets.QPushButton(\"浏览...\")\n        btn_browse.clicked.connect(self._browse_file)\n        path_row.addWidget(btn_browse)\n        form.addLayout(path_row)\n\n        btn_load_layers = QtWidgets.QPushButton(\"读取渲染层\")\n        btn_load_layers.clicked.connect(self._load_render_layers)\n        form.addWidget(btn_load_layers)\n\n        # ── 名称 ──\n        self._name_edit = QtWidgets.QLineEdit()\n        add_row(\"任务名称\", self._name_edit)\n\n        # ── Maya 版本 + 渲染器 ──\n        ver_row = QtWidgets.QHBoxLayout()\n        ver_row.addWidget(QtWidgets.QLabel(\"Maya 版本\"))\n        self._maya_cb = QtWidgets.QComboBox()\n        ver_list = [v[\"version\"] for v in self.maya_versions] or [\"2022\"]\n        self._maya_cb.addItems(ver_list)\n        self._maya_cb.setFixedWidth(80)\n        ver_row.addWidget(self._maya_cb)\n        ver_row.addSpacing(20)\n        ver_row.addWidget(QtWidgets.QLabel(\"渲染器\"))\n        self._renderer_cb = QtWidgets.QComboBox()\n        self._renderer_cb.addItems([\"redshift\", \"arnold\"])\n        self._renderer_cb.setFixedWidth(100)\n        self._renderer_cb.currentIndexChanged.connect(self._on_renderer_changed)\n        ver_row.addWidget(self._renderer_cb)\n        ver_row.addStretch()\n        form.addLayout(ver_row)\n\n        # ── 帧范围 ──\n        add_label(\"帧范围\")\n        fr_row = QtWidgets.QHBoxLayout()\n        fr_row.addWidget(QtWidgets.QLabel(\"起始\"))\n        self._start_spin = QtWidgets.QSpinBox()\n        self._start_spin.setRange(0, 99999)\n        self._start_spin.setValue(1)\n        fr_row.addWidget(self._start_spin)\n        fr_row.addWidget(QtWidgets.QLabel(\"结束\"))\n        self._end_spin = QtWidgets.QSpinBox()\n        self._end_spin.setRange(0, 99999)\n        self._end_spin.setValue(100)\n        fr_row.addWidget(self._end_spin)\n        fr_row.addWidget(QtWidgets.QLabel(\"步长\"))\n        self._step_spin = QtWidgets.QDoubleSpinBox()\n        self._step_spin.setRange(0.1, 100)\n        self._step_spin.setValue(1.0)\n        self._step_spin.setFixedWidth(70)\n        fr_row.addWidget(self._step_spin)\n        fr_row.addStretch()\n        form.addLayout(fr_row)\n\n        # ── 分辨率 ──\n        res_row = QtWidgets.QHBoxLayout()\n        res_row.addWidget(QtWidgets.QLabel(\"分辨率\"))\n        self._res_cb = QtWidgets.QComboBox()\n        for label, _, _ in RES_PRESETS:\n            self._res_cb.addItem(label)\n        self._res_cb.setCurrentIndex(2)\n        self._res_cb.currentIndexChanged.connect(self._on_res_preset)\n        res_row.addWidget(self._res_cb)\n        res_row.addWidget(QtWidgets.QLabel(\"W:\"))\n        self._w_spin = QtWidgets.QSpinBox()\n        self._w_spin.setRange(1, 16384)\n        self._w_spin.setValue(1920)\n        res_row.addWidget(self._w_spin)\n        res_row.addWidget(QtWidgets.QLabel(\"H:\"))\n        self._h_spin = QtWidgets.QSpinBox()\n        self._h_spin.setRange(1, 16384)\n        self._h_spin.setValue(1080)\n        res_row.addWidget(self._h_spin)\n        res_row.addStretch()\n        form.addLayout(res_row)\n\n        # ── 采样（按渲染器切换） ──\n        add_label(\"采样设置\")\n        self._samples_stack = QtWidgets.QStackedWidget()\n\n        # -- Redshift 采样 --\n        rs_widget = QtWidgets.QWidget()\n        rs_ly = QtWidgets.QHBoxLayout(rs_widget)\n        rs_ly.setContentsMargins(0, 0, 0, 0)\n        rs_ly.addWidget(QtWidgets.QLabel(\"Unified Max Samples\"))\n        self._rs_samples = QtWidgets.QSpinBox()\n        self._rs_samples.setRange(1, 99999)\n        self._rs_samples.setValue(256)\n        self._rs_samples.setFixedWidth(90)\n        rs_ly.addWidget(self._rs_samples)\n        rs_ly.addWidget(QtWidgets.QLabel(\"Threshold\"))\n        self._rs_threshold = QtWidgets.QDoubleSpinBox()\n        self._rs_threshold.setRange(0.001, 1.0)\n        self._rs_threshold.setValue(0.01)\n        self._rs_threshold.setDecimals(3)\n        self._rs_threshold.setSingleStep(0.005)\n        self._rs_threshold.setFixedWidth(80)\n        rs_ly.addWidget(self._rs_threshold)\n        rs_ly.addStretch()\n        self._samples_stack.addWidget(rs_widget)\n\n        # -- Arnold 采样 --\n        ar_widget = QtWidgets.QWidget()\n        ar_ly = QtWidgets.QGridLayout(ar_widget)\n        ar_ly.setContentsMargins(0, 0, 0, 0)\n        self._arnold_spins = {}\n        ar_fields = [\n            (\"AA\",        \"arnold_aa\",     5),\n            (\"Diffuse\",   \"arnold_diffuse\",  2),\n            (\"Specular\",  \"arnold_specular\", 2),\n            (\"Transmission\",\"arnold_transmission\", 2),\n            (\"SSS\",       \"arnold_sss\",      2),\n            (\"Volume\",    \"arnold_volume\",   2),\n        ]\n        for i, (label, key, default) in enumerate(ar_fields):\n            row, col = i // 2, (i % 2) * 2\n            ar_ly.addWidget(QtWidgets.QLabel(label + \":\"), row, col)\n            spin = QtWidgets.QSpinBox()\n            spin.setRange(0, 999)\n            spin.setValue(default)\n            spin.setFixedWidth(65)\n            self._arnold_spins[key] = spin\n            ar_ly.addWidget(spin, row, col + 1)\n        self._samples_stack.addWidget(ar_widget)\n\n        form.addWidget(self._samples_stack)\n\n        # ── 输出路径 ──\n        out_row = QtWidgets.QHBoxLayout()\n        out_row.addWidget(QtWidgets.QLabel(\"输出路径\"))\n        self._out_edit = QtWidgets.QLineEdit()\n        self._out_edit.setPlaceholderText(\"留空使用场景默认路径...\")\n        out_row.addWidget(self._out_edit, 1)\n        btn_out = QtWidgets.QPushButton(\"浏览...\")\n        btn_out.clicked.connect(self._browse_out)\n        out_row.addWidget(btn_out)\n        form.addLayout(out_row)\n\n        # ── 渲染层（勾选列表） ──\n        add_label(\"渲染层（勾选需要渲染的层）\")\n        self._layers_list = QtWidgets.QListWidget()\n        self._layers_list.setMaximumHeight(120)\n        form.addWidget(self._layers_list)\n\n        form.addStretch()\n\n        scroll.setWidget(inner)\n        layout.addWidget(scroll, 1)\n\n        # ── 按钮 ──\n        btn_row = QtWidgets.QHBoxLayout()\n        btn_row.addStretch()\n        btn_cancel = QtWidgets.QPushButton(\"取消\")\n        btn_cancel.clicked.connect(self.reject)\n        btn_row.addWidget(btn_cancel)\n        btn_ok = QtWidgets.QPushButton(\"确认\")\n        btn_ok.setObjectName(\"startBtn\")\n        btn_ok.clicked.connect(self._confirm)\n        btn_row.addWidget(btn_ok)\n        layout.addLayout(btn_row)\n\n        # 初始化渲染器对应的采样面板\n        self._on_renderer_changed()\n\n    # ── 渲染器切换 ──\n\n    def _on_renderer_changed(self, idx=None):\n        renderer = self._renderer_cb.currentText()\n        if renderer == \"redshift\":\n            self._samples_stack.setCurrentIndex(0)\n        else:\n            self._samples_stack.setCurrentIndex(1)\n\n    # ── 预设分辨率 ──\n\n    def _on_res_preset(self, idx):\n        label = RES_PRESETS[idx][0]\n        is_custom = (label == \"自定义\")\n        self._w_spin.setEnabled(is_custom)\n        self._h_spin.setEnabled(is_custom)\n        for lb, w, h in RES_PRESETS:\n            if lb == label and w is not None:\n                self._w_spin.setValue(w)\n                self._h_spin.setValue(h)\n                return\n\n    # ── 浏览文件 + 自动检测 ──\n\n    def _browse_file(self):\n        path, _ = QtWidgets.QFileDialog.getOpenFileName(\n            self, \"选择 Maya 场景文件\", \"\",\n            \"Maya 文件 (*.ma *.mb);;所有文件 (*.*)\",\n        )\n        if path:\n            self._file_edit.setText(path)\n            if not self._name_edit.text():\n                self._name_edit.setText(os.path.splitext(os.path.basename(path))[0])\n            # 自动读取场景设置\n            self._auto_read_settings(path)\n\n    # ── 自动读取场景设置 ──\n\n    def _auto_read_settings(self, file_path=None):\n        \"\"\"选文件后快速读取：.ma 文本解析（瞬发），.mb 只推断渲染器\"\"\"\n        file_path = file_path or self._file_edit.text().strip()\n        if not file_path or not os.path.isfile(file_path):\n            return\n\n        # 从文件头快速推断渲染器\n        inferred = detect_renderer_from_file(file_path)\n        if inferred:\n            idx = self._renderer_cb.findText(inferred)\n            if idx >= 0:\n                self._renderer_cb.setCurrentIndex(idx)\n\n        # .ma 文件：文本解析帧范围、分辨率、采样（瞬发，不需要 mayapy）\n        if file_path.lower().endswith('.ma'):\n            settings = parse_ma_settings(file_path)\n            if settings:\n                self._apply_settings(settings)\n        # .mb 文件：需要 mayapy，提示用户点\"读取渲染层\"\n        else:\n            if self._layers_list.count() == 0:\n                # 先填默认渲染层\n                self._layers_list.clear()\n                item = QtWidgets.QListWidgetItem(\"masterLayer\")\n                item.setFlags(item.flags() | QtCore.Qt.ItemIsUserCheckable)\n                item.setCheckState(QtCore.Qt.Checked)\n                self._layers_list.addItem(item)\n\n    def _apply_settings(self, settings):\n        \"\"\"把设置字典填入界面控件\"\"\"\n        if \"start_frame\" in settings:\n            self._start_spin.setValue(settings[\"start_frame\"])\n        if \"end_frame\" in settings:\n            self._end_spin.setValue(settings[\"end_frame\"])\n        if \"step\" in settings:\n            self._step_spin.setValue(float(settings[\"step\"]))\n        if \"width\" in settings:\n            self._w_spin.setValue(settings[\"width\"])\n        if \"height\" in settings:\n            self._h_spin.setValue(settings[\"height\"])\n        if \"rs_samples\" in settings:\n            self._rs_samples.setValue(settings[\"rs_samples\"])\n        if \"rs_threshold\" in settings:\n            self._rs_threshold.setValue(float(settings[\"rs_threshold\"]))\n        for key in self._arnold_spins:\n            if key in settings:\n                self._arnold_spins[key].setValue(settings[key])\n        layers = settings.get(\"layers\", [\"masterLayer\"])\n        self._layers_list.clear()\n        for layer in layers:\n            item = QtWidgets.QListWidgetItem(layer)\n            item.setFlags(item.flags() | QtCore.Qt.ItemIsUserCheckable)\n            item.setCheckState(QtCore.Qt.Checked)\n            self._layers_list.addItem(item)\n        self._on_renderer_changed()\n\n    def _load_render_layers(self):\n        \"\"\"手动点击 — 用 mayapy 完整读取场景全部设置\"\"\"\n        file_path = self._file_edit.text().strip()\n        if not file_path or not os.path.isfile(file_path):\n            QtWidgets.QMessageBox.warning(self, \"警告\", \"请先选择有效的 Maya 文件\")\n            return\n\n        maya_ver = self._maya_cb.currentText()\n        mayapy_path = None\n        for mv in self.maya_versions:\n            if mv[\"version\"] == maya_ver:\n                mayapy_path = mv[\"mayapy\"]\n                break\n        if not mayapy_path or not os.path.isfile(mayapy_path):\n            # 尝试任意可用版本的 mayapy\n            for mv in self.maya_versions:\n                if os.path.isfile(mv.get(\"mayapy\", \"\")):\n                    mayapy_path = mv[\"mayapy\"]\n                    break\n        if not mayapy_path:\n            QtWidgets.QMessageBox.warning(self, \"警告\", \"未找到可用的 mayapy\")\n            return\n\n        # 先合并 .ma 文本解析结果\n        settings = {}\n        if file_path.lower().endswith('.ma'):\n            settings = parse_ma_settings(file_path)\n\n        QtWidgets.QApplication.setOverrideCursor(QtCore.Qt.WaitCursor)\n        try:\n            mp_settings = read_scene_settings(file_path, mayapy_path)\n        except Exception as e:\n            QtWidgets.QApplication.restoreOverrideCursor()\n            QtWidgets.QMessageBox.warning(self, \"错误\", f\"读取异常: {e}\")\n            return\n        finally:\n            QtWidgets.QApplication.restoreOverrideCursor()\n\n        for k, v in (mp_settings or {}).items():\n            if k not in settings or not settings[k]:\n                settings[k] = v\n\n        if not settings or not settings.get(\"layers\"):\n            # 至少填上默认渲染层\n            if not settings:\n                settings = {}\n            if not settings.get(\"layers\"):\n                settings[\"layers\"] = [\"masterLayer\"]\n            self._apply_settings(settings)\n            QtWidgets.QMessageBox.information(\n                self, \"提示\",\n                \"只读取到部分设置。\\n\"\n                \"渲染层已默认设为 masterLayer。\\n\"\n                \"帧范围/分辨率/采样请手动设置。\\n\\n\"\n                \"（.mb 文件且渲染器插件加载失败时可能出现此情况）\"\n            )\n            return\n\n        # 渲染器\n        if \"renderer\" in settings:\n            idx = self._renderer_cb.findText(settings[\"renderer\"])\n            if idx >= 0:\n                self._renderer_cb.setCurrentIndex(idx)\n\n        self._apply_settings(settings)\n\n    def _get_checked_layers(self):\n        layers = []\n        for i in range(self._layers_list.count()):\n            item = self._layers_list.item(i)\n            if item.checkState() == QtCore.Qt.Checked:\n                layers.append(item.text())\n        return layers if layers else [\"masterLayer\"]\n\n    def _set_checked_layers(self, layer_list):\n        \"\"\"设置勾选（追加新层，勾选已有层）\"\"\"\n        existing = {self._layers_list.item(i).text(): i\n                    for i in range(self._layers_list.count())}\n        for layer in layer_list:\n            if layer in existing:\n                self._layers_list.item(existing[layer]).setCheckState(QtCore.Qt.Checked)\n\n    # ── 输出路径 ──\n\n    def _browse_out(self):\n        path = QtWidgets.QFileDialog.getExistingDirectory(self, \"选择输出目录\")\n        if path:\n            self._out_edit.setText(path)\n\n    # ── 填充已有 job ──\n\n    def _fill_from_job(self):\n        j = self.job\n        self._file_edit.setText(j.file_path)\n        self._name_edit.setText(j.name)\n        idx = self._maya_cb.findText(j.maya_version)\n        if idx >= 0: self._maya_cb.setCurrentIndex(idx)\n        idx = self._renderer_cb.findText(j.renderer)\n        if idx >= 0: self._renderer_cb.setCurrentIndex(idx)\n        self._start\n# ... (truncated)"}, {"name": "app/job_model.py", "content": "\"\"\"\nRenderJob 数据模型\n\"\"\"\nimport os\nimport uuid\nimport json\nfrom datetime import datetime\n\n\nclass RenderJob:\n    \"\"\"单个渲染任务的配置数据\"\"\"\n\n    def __init__(self, **kwargs):\n        self.id          = kwargs.get(\"id\") or str(uuid.uuid4())[:8]\n        self.name        = kwargs.get(\"name\", \"未命名\")\n        self.file_path   = kwargs.get(\"file_path\", \"\")\n        self.maya_version    = kwargs.get(\"maya_version\", \"\")\n        self.renderer        = kwargs.get(\"renderer\", \"redshift\")\n\n        # ── 帧 / 分辨率 ──\n        self.start_frame     = kwargs.get(\"start_frame\", 1)\n        self.end_frame       = kwargs.get(\"end_frame\", 100)\n        self.step            = kwargs.get(\"step\", 1.0)\n        self.width           = kwargs.get(\"width\", 1920)\n        self.height          = kwargs.get(\"height\", 1080)\n\n        # ── 采样（按渲染器分开） ──\n        # Redshift\n        self.rs_samples      = kwargs.get(\"rs_samples\", 256)       # unified max\n        self.rs_threshold    = kwargs.get(\"rs_threshold\", 0.01)    # adaptive threshold\n        # Arnold\n        self.arnold_aa       = kwargs.get(\"arnold_aa\", 5)          # AA samples\n        self.arnold_diffuse  = kwargs.get(\"arnold_diffuse\", 2)\n        self.arnold_specular = kwargs.get(\"arnold_specular\", 2)\n        self.arnold_transmission = kwargs.get(\"arnold_transmission\", 2)\n        self.arnold_sss      = kwargs.get(\"arnold_sss\", 2)\n        self.arnold_volume   = kwargs.get(\"arnold_volume\", 2)\n\n        # ── 输出 ──\n        self.output_path     = kwargs.get(\"output_path\", \"\")\n        self.render_layers   = kwargs.get(\"render_layers\", [\"masterLayer\"])\n\n        # ── 状态 ──\n        self.status          = kwargs.get(\"status\", \"pending\")\n        self.created_at      = kwargs.get(\"created_at\", datetime.now().isoformat())\n        self._error_msg      = kwargs.get(\"_error_msg\", \"\")\n\n    @property\n    def resolution_label(self):\n        w, h = self.width, self.height\n        if w == 3840 and h == 2160: return \"4K\"\n        if w == 2560 and h == 1440: return \"2K\"\n        if w == 1920 and h == 1080: return \"1080p\"\n        if w == 1280 and h == 720:  return \"720p\"\n        return f\"{w}x{h}\"\n\n    @property\n    def frame_range_label(self):\n        s, e = self.start_frame, self.end_frame\n        return f\"{s}-{e}\" if s != e else str(s)\n\n    @property\n    def file_name(self):\n        return os.path.splitext(os.path.basename(self.file_path))[0] if self.file_path else \"\"\n\n    @property\n    def samples_label(self):\n        if self.renderer == \"redshift\":\n            return str(self.rs_samples)\n        return f\"AA{self.arnold_aa}\"\n\n    def to_dict(self):\n        return {\n            \"id\": self.id, \"name\": self.name, \"file_path\": self.file_path,\n            \"maya_version\": self.maya_version, \"renderer\": self.renderer,\n            \"start_frame\": self.start_frame, \"end_frame\": self.end_frame,\n            \"step\": self.step, \"width\": self.width, \"height\": self.height,\n            \"rs_samples\": self.rs_samples, \"rs_threshold\": self.rs_threshold,\n            \"arnold_aa\": self.arnold_aa, \"arnold_diffuse\": self.arnold_diffuse,\n            \"arnold_specular\": self.arnold_specular,\n            \"arnold_transmission\": self.arnold_transmission,\n            \"arnold_sss\": self.arnold_sss, \"arnold_volume\": self.arnold_volume,\n            \"output_path\": self.output_path,\n            \"render_layers\": self.render_layers,\n            \"status\": self.status, \"created_at\": self.created_at,\n            \"_error_msg\": self._error_msg,\n        }\n\n    @classmethod\n    def from_dict(cls, d):\n        return cls(**d)\n\n    def __repr__(self):\n        return f\"RenderJob({self.name}, {self.renderer}, {self.frame_range_label}, {self.status})\"\n\n\ndef jobs_to_json(jobs: list) -> str:\n    return json.dumps([j.to_dict() for j in jobs], ensure_ascii=False, indent=2)\n\n\ndef jobs_from_json(text: str) -> list:\n    data = json.loads(text)\n    return [RenderJob.from_dict(d) for d in data]\n"}, {"name": "app/queue_manager.py", "content": "\"\"\"\n队列管理器 — 增删改查 + JSON 文件持久化\n\"\"\"\nimport os\nfrom .job_model import RenderJob, jobs_to_json, jobs_from_json\n\n\nclass QueueManager:\n    \"\"\"管理渲染队列的数据层\"\"\"\n\n    def __init__(self, save_path=None):\n        if save_path is None:\n            save_path = os.path.join(os.path.dirname(os.path.dirname(__file__)), \"jobs.json\")\n        self._save_path = save_path\n        self._jobs = []\n        self._on_change = None\n\n    def set_on_change(self, callback):\n        self._on_change = callback\n\n    def _notify(self):\n        if self._on_change:\n            self._on_change()\n        self.save()\n\n    # ── 增删改查 ──\n\n    def add(self, job: RenderJob):\n        self._jobs.append(job)\n        self._notify()\n\n    def remove(self, job_id: str):\n        self._jobs = [j for j in self._jobs if j.id != job_id]\n        self._notify()\n\n    def remove_many(self, job_ids: list):\n        ids_set = set(job_ids)\n        self._jobs = [j for j in self._jobs if j.id not in ids_set]\n        self._notify()\n\n    def get(self, job_id: str):\n        for j in self._jobs:\n            if j.id == job_id:\n                return j\n        return None\n\n    def update(self, job_id: str, **kwargs):\n        job = self.get(job_id)\n        if job:\n            for k, v in kwargs.items():\n                if hasattr(job, k):\n                    setattr(job, k, v)\n            self._notify()\n\n    def move_up(self, job_id: str):\n        for i, j in enumerate(self._jobs):\n            if j.id == job_id and i > 0:\n                self._jobs[i], self._jobs[i - 1] = self._jobs[i - 1], self._jobs[i]\n                self._notify()\n                return\n\n    def move_down(self, job_id: str):\n        for i, j in enumerate(self._jobs):\n            if j.id == job_id and i < len(self._jobs) - 1:\n                self._jobs[i], self._jobs[i + 1] = self._jobs[i + 1], self._jobs[i]\n                self._notify()\n                return\n\n    @property\n    def all(self):\n        return list(self._jobs)\n\n    @property\n    def pending(self):\n        return [j for j in self._jobs if j.status == \"pending\"]\n\n    @property\n    def count(self):\n        return len(self._jobs)\n\n    def set_status(self, job_id: str, status: str, error_msg: str = \"\"):\n        job = self.get(job_id)\n        if job:\n            job.status = status\n            job._error_msg = error_msg\n            self._notify()\n\n    # ── 持久化 ──\n\n    def save(self):\n        try:\n            os.makedirs(os.path.dirname(self._save_path), exist_ok=True)\n            with open(self._save_path, \"w\", encoding=\"utf-8\") as f:\n                f.write(jobs_to_json(self._jobs))\n        except Exception as e:\n            print(f\"[QueueManager] save error: {e}\")\n\n    def load(self):\n        if not os.path.isfile(self._save_path):\n            return\n        try:\n            with open(self._save_path, \"r\", encoding=\"utf-8\") as f:\n                text = f.read()\n            if text.strip():\n                self._jobs = jobs_from_json(text)\n                for j in self._jobs:\n                    if j.status == \"running\":\n                        j.status = \"pending\"\n        except Exception as e:\n            print(f\"[QueueManager] load error: {e}\")\n            self._jobs = []\n        self._notify()\n"}], "methods": []}, {"software": "Maya", "subtag": "通用", "category": "成功", "name": "maya-startup-fix", "description": "Maya 启动报错一键修复 — 解锁defaultTextureList1 + colorSpace修复 + filePathEditor清理", "usage": ["# 一键修复：\nexec(open(r'D:\\zcy\\ai_ty\\maya_startup_fix.py', encoding='utf-8').read())\n\n# 单独调用某个功能：\nimport maya_startup_fix\nmaya_startup_fix.unlock_default_texture_list()\nmaya_startup_fix.fix_file_colorspaces()"], "files": [{"name": "maya_startup_fix.py", "path": "d:/zcy/ai_ty/maya_startup_fix.py"}], "package": "maya_startup_fix.zip", "is_tracking": false, "errorPatterns": ["is not defined", "Connection not made: Destination is locked"], "embeddedScripts": [{"name": "maya_startup_fix.py", "content": "\"\"\"\nMaya 启动修复工具 — 一键解决场景打开后常见问题。\n\n修复内容：\n  1. 解锁 defaultTextureList1.textures —— 解决 \"Connection not made: Destination is locked\"\n  2. 清理 filePathEditor 重复注册警告\n  3. 修复 file 节点的 colorSpace 设置（OCIO 配置中缺失 sRGB 时回退为安全值）\n  4. 报告 XGen 缺失文件和贴图路径问题（不自动修复，仅列出）\n\n使用方法：\n  方法A — Maya Script Editor (Python 标签页) 中粘贴运行：\n    exec(open(r'D:\\\\zcy\\\\ai_ty\\\\maya_startup_fix.py', encoding='utf-8').read())\n\n  方法B — 要每次打开 Maya 自动运行，在 userSetup.py 中加入：\n    import sys; sys.path.append(r'D:\\zcy\\ai_ty')\n    import maya_startup_fix; maya_startup_fix.run()\n\n  方法C — 单独调用某个功能：\n    import maya_startup_fix\n    maya_startup_fix.unlock_default_texture_list()\n    maya_startup_fix.clean_filepath_editor_registry()\n    maya_startup_fix.fix_file_colorspaces()\n    maya_startup_fix.report_missing_paths()\n\"\"\"\n\nimport maya.cmds as cmds\nimport sys\nimport os\n\n\n# ============================================================================\n# 1. 解锁 defaultTextureList1.textures\n# ============================================================================\n\ndef unlock_default_texture_list():\n    \"\"\"\n    解锁 defaultTextureList1.textures 属性。\n\n    问题现象：创建 file 节点时报错：\n        Error: Connection not made: 'fileXXX.message' -> 'defaultTextureList1.textures[-1]'.\n        Destination is locked.\n\n    原因：defaultTextureList1 是 Maya 内部管理所有 file 纹理节点的列表，\n         节点本身作为 container 被锁定，导致其子属性也被锁。\n         必须先解锁节点，再解锁属性。\n\n    解决策略（按优先级尝试）：\n      1. lockNode -lock 0 解锁节点容器\n      2. setAttr 解锁 textures 属性\n      3. 用 MEL 命令强制解锁\n    \"\"\"\n    node_name = \"defaultTextureList1\"\n    attr_name = \"textures\"\n\n    if not cmds.objExists(node_name):\n        print(\"[fix_startup] {} 节点不存在，跳过。\".format(node_name))\n        return False\n\n    # 先检查属性是否已经被锁\n    try:\n        locked = cmds.getAttr(node_name + \".\" + attr_name, lock=True)\n    except Exception:\n        locked = True  # 读不到就假定锁定\n\n    if not locked:\n        print(\"[fix_startup] {} 已经是解锁状态，无需修复。\".format(node_name + \".\" + attr_name))\n        return True\n\n    # 策略1：解锁节点本身（container lock）\n    try:\n        cmds.lockNode(node_name, lock=False, lockUnpublished=False)\n        print(\"[fix_startup]   已解锁节点 {}\".format(node_name))\n    except Exception as e1:\n        print(\"[fix_startup]   解锁节点失败 ({}), 尝试其他方式...\".format(e1))\n\n    # 策略2：解锁属性\n    try:\n        cmds.setAttr(node_name + \".\" + attr_name, lock=False)\n        print(\"[fix_startup] ✓ 已解锁 {}\".format(node_name + \".\" + attr_name))\n        return True\n    except Exception as e2:\n        pass  # 继续尝试\n\n    # 策略3：通过 MEL 强制解锁\n    try:\n        import maya.mel as mel\n        mel.eval('setAttr -lock 0 {}.{};'.format(node_name, attr_name))\n        print(\"[fix_startup] ✓ 通过 MEL 已解锁 {}\".format(node_name + \".\" + attr_name))\n        return True\n    except Exception as e3:\n        pass\n\n    # 策略4：删除并让 Maya 重新创建该节点\n    # 注意：这是最后手段，可能影响场景中的 file 节点连接\n    try:\n        cmds.lockNode(node_name, lock=False, lockUnpublished=False)\n        cmds.delete(node_name)\n        print(\"[fix_startup]   已删除 {}, Maya 将自动重建\".format(node_name))\n        # Maya 在下次创建 file 节点时会自动重建 defaultTextureList1\n        return True\n    except Exception as e4:\n        print(\"[fix_startup] ✗ 所有方法均失败: {}\".format(e4))\n        return False\n\n\n# ============================================================================\n# 2. 清理 filePathEditor 重复注册警告\n# ============================================================================\n\ndef clean_filepath_editor_registry():\n    \"\"\"\n    清理 filePathEditor 中的重复属性注册。\n\n    问题现象：\n        Warning: filePathEditor: Attribute 'aiImage.filename' is invalid or\n        is not designated 'usedAsFilename'.   (Arnold 未加载时属性不存在)\n        Warning: filePathEditor: Attribute 'aiStandIn.dso' and label 'Standin'\n        have been saved already.              (重复注册)\n\n    原因：prefs 文件 filePathEditorRegistryPrefs.mel 中记录了 Arnold 属性，\n         但每次 Maya 启动、Arnold 加载时又写入一次，导致重复。\n         如果 Arnold 加载晚于 prefs 读取，还会报 \"invalid attribute\"。\n\n    解决：\n      1. 删除硬盘上的 filePathEditorRegistryPrefs.mel，重启 Maya 后 Arnold 会写一份干净的\n      2. 同时清理内存中的 optionVar\n    \"\"\"\n    cleaned = False\n\n    # --- 方法1：直接删除 prefs 文件（最彻底） ---\n    maya_version = cmds.about(version=True)\n    prefs_dir = os.path.join(\n        os.path.expanduser(\"~\"), \"Documents\", \"maya\", maya_version, \"prefs\"\n    )\n    prefs_file = os.path.join(prefs_dir, \"filePathEditorRegistryPrefs.mel\")\n\n    if os.path.exists(prefs_file):\n        try:\n            backup = prefs_file + \".bak\"\n            # 先备份\n            with open(prefs_file, 'r') as f:\n                content = f.read()\n            # 只保留非 Arnold 的行（安全做法：清空全部，让插件重建）\n            # 实际上直接删掉最干净，Maya 和插件会自动重建\n            os.remove(prefs_file)\n            print(\"[fix_startup] ✓ 已删除 {}\".format(prefs_file))\n            print(\"[fix_startup]   下次启动 Maya 时插件会重新生成干净的注册。\")\n            cleaned = True\n        except Exception as e:\n            print(\"[fix_startup] ⚠ 无法删除 prefs 文件: {}\".format(e))\n\n    # --- 方法2：清理内存中的 optionVar ---\n    # Maya 中 filePathEditor 的注册可能也缓存在 optionVar 里\n    try:\n        all_vars = cmds.optionVar(list=True) or []\n    except Exception:\n        all_vars = []\n\n    # 尝试多种前缀（不同 Maya 版本可能不同）\n    prefixes = [\n        \"filePathEditorRegistry\",\n        \"filePathEditor\",\n        \"fpeRegistry\",\n    ]\n    removed = 0\n    for var in all_vars:\n        for prefix in prefixes:\n            if var.lower().startswith(prefix.lower()):\n                try:\n                    cmds.optionVar(remove=var)\n                    removed += 1\n                except Exception:\n                    pass\n                break\n\n    if removed > 0:\n        print(\"[fix_startup] ✓ 已清理 {} 个 filePathEditor optionVar。\".format(removed))\n        cleaned = True\n\n    if not cleaned:\n        print(\"[fix_startup] 未找到需要清理的 filePathEditor 注册。\")\n\n    return cleaned\n\n\n# ============================================================================\n# 3. 修复 file 节点 colorSpace\n# ============================================================================\n\ndef get_available_color_spaces():\n    \"\"\"获取当前 OCIO 配置中所有可用的色彩空间名称列表\"\"\"\n    try:\n        return cmds.colorManagementPrefs(query=True, colorSpaceNames=True) or []\n    except Exception:\n        return []\n\n\ndef get_input_color_spaces():\n    \"\"\"获取输入色彩空间列表（用于 file 节点）\"\"\"\n    try:\n        return cmds.colorManagementPrefs(query=True, inputSpaceNames=True) or []\n    except Exception:\n        return []\n\n\ndef fix_file_colorspaces(dry_run=False):\n    \"\"\"\n    修复所有 file 节点的 .colorSpace 属性。\n\n    问题现象：\n        Warning: Color space \"sRGB\" in node \":file65\" is not defined\n        in the selected transform collection.\n\n    原因：Maya 场景引用了一个在当前 OCIO 配置中不存在的色彩空间。\n         通常是场景在另一台机器/配置下创建的。\n\n    修复逻辑：\n      1. 读取当前可用的色彩空间列表\n      2. 扫描全部 file 节点\n      3. 如果 file 节点的 colorSpace 不在可用列表中：\n         - 尝试映射到等效空间（如 \"sRGB\" -> \"SRGB\", \"Raw\" -> \"ACES - ACEScg\"）\n         - 如果找不到映射，设为 \"Raw\" 或列表中的第一个空间\n      4. 也可以关闭色彩管理（将 colorSpace 置空）\n\n    参数:\n        dry_run: True 则只报告不修改\n    \"\"\"\n    available = set(get_available_color_spaces())\n    input_spaces = set(get_input_color_spaces()) if get_input_color_spaces() else available\n\n    if not available:\n        print(\"[fix_startup] ⚠ 未检测到任何色彩空间，可能是 OCIO 配置缺失。\")\n        print(\"[fix_startup]   跳过修复，不修改任何色彩管理设置。\")\n        return 0, 0\n\n    # 常用色彩空间名映射（不区分大小写）\n    # OCIO 配置版本不同可能导致同一个空间名写法不同\n    FALLBACK_MAP = {\n        \"sRGB\":       [\"sRGB\", \"srgb\", \"sRGB - Display\", \"sRGB Texture\", \"SRGB\", \"Utility - sRGB - Texture\"],\n        \"Raw\":        [\"Raw\", \"raw\", \"RAW\", \"Utility - Raw\", \"ACES - ACEScg\", \"ACEScg\"],\n        \"Linear\":     [\"Linear\", \"linear\", \"scene_linear\", \"ACES - ACEScg\"],\n        \"ACEScg\":     [\"ACEScg\", \"ACES - ACEScg\", \"acescg\"],\n        \"ACES2065-1\": [\"ACES2065-1\", \"ACES - ACES2065-1\"],\n        \"input\":      [],\n    }\n\n    file_nodes = cmds.ls(type=\"file\")\n    if not file_nodes:\n        print(\"[fix_startup] 场景中没有 file 节点。\")\n        return 0, 0\n\n    fixed = 0\n    reported = 0\n\n    for fn in file_nodes:\n        # 检查是否有 colorSpace 属性（老版本 Maya 没有）\n        if not cmds.attributeQuery(\"colorSpace\", node=fn, exists=True):\n            continue\n\n        try:\n            current_cs = cmds.getAttr(fn + \".colorSpace\")\n        except Exception:\n            continue\n\n        if not current_cs:\n            continue  # 空值 = 无色彩管理，正常\n\n        if current_cs in available:\n            continue  # 已正常\n\n        reported += 1\n\n        # 尝试找到等效空间\n        candidates = FALLBACK_MAP.get(current_cs, [current_cs])\n        replacement = None\n\n        for cand in candidates:\n            # 精确匹配\n            if cand in available:\n                replacement = cand\n                break\n            # 不区分大小写匹配\n            lower_match = [s for s in available if s.lower() == cand.lower()]\n            if lower_match:\n                replacement = lower_match[0]\n                break\n            # 子串匹配\n            sub_matches = [s for s in available if cand.lower() in s.lower()]\n            if sub_matches:\n                replacement = sub_matches[0]\n                break\n\n        # 如果所有尝试都失败，看 input_spaces 里有什么\n        if replacement is None and input_spaces:\n            # 从 input_spaces 中选一个最通用的\n            for pref in [\"Raw\", \"Utility - Raw\", \"ACES - ACEScg\"]:\n                if pref in input_spaces:\n                    replacement = pref\n                    break\n            if replacement is None:\n                replacement = sorted(input_spaces)[0]\n\n        if replacement is None:\n            # 无法映射：跳过，不修改（保持原样，由用户手动处理）\n            print(\"[fix_startup] ⚠ {}: colorSpace='{}' 无法映射到可用空间，跳过\".format(fn, current_cs))\n            continue\n\n        if dry_run:\n            print(\"[fix_startup] [DRY RUN] {}: '{}' -> '{}'\".format(fn, current_cs, replacement))\n        else:\n            try:\n                cmds.setAttr(fn + \".colorSpace\", replacement, type=\"string\")\n                fixed += 1\n                print(\"[fix_startup] ✓ {}: '{}' -> '{}'\".format(fn, current_cs, replacement))\n            except Exception as e:\n                print(\"[fix_startup] ✗ {}: 设置失败 -- {}\".format(fn, e))\n\n    if dry_run:\n        print(\"[fix_startup] [DRY RUN] 共发现 {} 个 file 节点 colorSpace 有问题。\".format(reported))\n    else:\n        print(\"[fix_startup] ✓ 共修复 {} / {} 个 file 节点 colorSpace。\".format(fixed, reported))\n\n    return fixed, reported\n\n\n# ============================================================================\n# 4. 报告缺失路径（XGen / 贴图）\n# ============================================================================\n\ndef report_missing_paths():\n    \"\"\"\n    扫描场景中所有指向不存在路径的节点，汇总报告。\n\n    不自动修复（因为需要找到实际文件），只列出清单方便排查。\n\n    检查范围：\n      - file 节点的 .fileTextureName\n      - XGen 相            dst_node = m.group(3)\n                referenced.add(src_node)\n                referenced.add(dst_node)\n                referencing[src_node].add(dst_node)\n\n    print(f\"  找到 {len(referenced):,} 个被引用的节点\")\n\n    # 孤儿节点：没有被任何 connectAttr 引用，也不引用其他节点\n    orphaned = {}\n    for name, ntype in nodes.items():\n        if name not in referenced:\n            orphaned[name] = ntype\n\n    return nodes, referenced, referencing, orphaned, lines\n\ndef is_safe_to_remove(node_name, node_type, nodes, referenced, referencing):\n    \"\"\"判断节点是否可以安全删除\"\"\"\n    # 排除系统关键节点\n    system_prefixes = [':', 'persp', 'top', 'front', 'side', 'default',\n                       'layerManager', 'renderLayerManager', 'renderPartition',\n                       'lightLinker', 'shapeEditorManager', 'poseInterpolatorManager',\n                       'defaultLayer', 'defaultRenderLayer', 'defaultLightSet',\n                       'defaultObjectSet', 'initialShadingGroup', 'initialParticleSE',\n                       'initialMaterialInfo', 'lambert1', 'particleCloud1',\n                       'standardSurface1']\n\n    if node_name.startswith(':'):\n        return False, \"系统节点\"\n    for prefix in system_prefixes:\n        if node_name == prefix or node_name.startswith(prefix):\n            return False, \"系统/默认节点\"\n\n    # nodeGraphEditorInfo 及其变种 - 已在前一轮删除\n    # 检查是否是 UI 相关节点\n    ui_patterns = ['hyperShadePrimary', 'hyperGraph', 'hyperLayout',\n                   'nodeEditorPanel', 'nodeGraphEditor']\n\n    for pat in ui_patterns:\n        if pat in node_name:\n            return True, \"UI编辑器数据\"\n\n    # 基于类型判断\n    safe_types = {\n        'polyBridgeEdge': '遗留构造历史',\n        'polyExtrudeFace': '遗留构造历史',\n        'polyExtrudeEdge': '遗留构造历史',\n        'polyBevel': '遗留构造历史',\n        'polySmoothFace': '遗留构造历史',\n        'polySplit': '遗留构造历史',\n        'polyTweak': '遗留构造历史',\n        'polyDelEdge': '遗留构造历史',\n        'polyCloseBorder': '遗留构造历史',\n        'polyMergeVert': '遗留
